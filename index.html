/* =====================================================
   EVOLUCIÓN DINÁMICA DE ESCUDERÍAS (F1)
   - Cada equipo tiene un tier dinámico que camina lentamente con reversión a su
     identidad histórica (baseTier = F1_TEAMS.tier) y un "momentum" que decae solo,
     generando rachas de varias temporadas en vez de ruido temporada a temporada.
   - No modifica ninguna fórmula de la simulación de temporada: solo actualiza el
     valor de tier que esa simulación consume para los equipos de F1.
===================================================== */
function initTeamDynamics(){
 const dyn = {};
 F1_TEAMS.forEach(t=>{
   // Variación inicial de partida: pequeño offset aleatorio (~±3.5) sobre el nivel base, así dos carreras
   // nuevas nunca arrancan con la parrilla exactamente igual. El nivel base (F1_TEAMS.tier) no se toca.
   const startVariation = (rnd()*2-1) * 3.5;
   dyn[t.name] = {tier: clamp(t.tier + startVariation, 30, 99), momentum:0, lastDelta:0, hadProject:false, seasonsAtTop:0};
 });
 return dyn;
}
// Tier actual de un equipo de F1 (dinámico si ya evolucionó, base si todavía no se inicializó).
function getF1TeamTier(name){
 const dyn = S.teamDynamics && S.teamDynamics[name];
 if(dyn) return dyn.tier;
 const base = F1_TEAMS.find(t=>t.name===name);
 return base ? base.tier : 60;
}
// Nivel de referencia aproximado de la parrilla actual, solo para decidir cuánto margen de mejora/caída
// tiene cada equipo (no se usa para nada más, no hace falta tocarlo si se agregan/sacan equipos).
const GRID_REF_TIER = 74;
// Un paso de evolución para un equipo al cerrar la temporada.
// ctx (opcional) trae el contexto de "eras" calculado en evolveF1Teams: si este equipo es el líder vigente,
// hace cuántas temporadas seguidas lidera (leaderStreak), un empujoncito de catch-up si es perseguidor cercano
// de un líder que domina hace rato, y si le tocó un chance extra de "proyecto sorpresa" por ser un equipo chico.
function evolveF1Team(dyn, baseTier, ctx){
 const aboveBase = dyn.tier > baseTier;
 // Resiliencia direccional: a un equipo grande le cuesta menos remontar cuando está mal (tira fuerte hacia arriba
 // si está por debajo de su identidad); a un equipo chico le cuesta más sostener un buen momento (tira fuerte hacia
 // abajo si está por encima de su identidad). Así "el pez grande vuelve rápido" y "el pez chico no se sostiene arriba".
 const resiliencia = aboveBase
   ? clamp(0.02 + (66-baseTier)/650, 0.015, 0.055)
   : clamp(0.02 + (baseTier-58)/480, 0.015, 0.075);

 // Fatiga de dominancia: cuantas más temporadas SEGUIDAS lidera un equipo, más le cuesta seguir creciendo y más
 // probabilidad de que su próximo "proyecto" sea un estancamiento en vez de un salto hacia arriba. No es un techo
 // rígido: es una tendencia que se acumula sola y hace que, tarde o temprano, cualquier era se apague de a poco.
 const leaderStreak = (ctx && ctx.isLeader) ? ctx.leaderStreak : 0;
 const fatigue = clamp(leaderStreak * 0.11, 0, 0.8); // ~9 temporadas seguidas arriba = fatiga casi máxima

 const shock = (rnd()*2-1) * 1.3; // ruido temporada a temporada, moderado a propósito: la variación grande viene del "proyecto", no de acá
 let momentumRaw = dyn.momentum*0.8 + shock*0.5;
 if(fatigue>0) momentumRaw -= fatigue*1.5; // el líder fatigado pierde impulso propio
 dyn.momentum = clamp(momentumRaw, -4, 4);

 let pull = (baseTier - dyn.tier) * resiliencia;
 if(fatigue>0 && pull>0) pull *= (1-fatigue); // si el líder viene remontando hacia su identidad, la fatiga frena esa remontada

 let jump = 0, hadProject = false;
 // probabilidad de "proyecto" (salto grande, poco frecuente): un equipo históricamente perseguidor tiene
 // un pelín más de chance de que le toque uno (su "proyecto sorpresa"), sin dejar de ser poco frecuente
 const projectChance = 0.07 + ((ctx && ctx.surpriseBoost) ? 0.04 : 0);
 if(rnd() < projectChance){
   // sin fatiga el salto es ~50/50 arriba o abajo; un líder que domina hace muchas temporadas tiene más
   // chance de que ese salto puntual sea hacia abajo (estancamiento / crisis interna del proyecto)
   const downBias = 0.5 + fatigue*0.35;
   jump = (rnd()<downBias ? -1 : 1) * (4 + rnd()*3);
   hadProject = true;
 }

 const catchUp = (ctx && ctx.catchUpBoost) || 0; // empujoncito para perseguidores cercanos de un líder fatigado

 // Margen de variación asimétrico: los equipos por debajo del nivel medio de la parrilla tienen más margen
 // para crecer (y sorprender) que para caer más todavía; los que están por encima, al revés. Esto permite que,
 // con el tiempo, un equipo chico realmente le pise el terreno a uno grande, no que roten siempre entre los mismos 3-4.
 const belowGridRef = baseTier < GRID_REF_TIER;
 const upRoom = belowGridRef ? 30 : 14;
 const downRoom = belowGridRef ? 14 : 30;
 const prevTier = dyn.tier;
 dyn.tier = clamp(dyn.tier + dyn.momentum + pull + jump + catchUp, baseTier-downRoom, baseTier+upRoom);
 dyn.tier = clamp(dyn.tier, 30, 99);
 dyn.lastDelta = dyn.tier - prevTier;
 dyn.hadProject = hadProject;
}
// Evoluciona toda la parrilla de F1 un paso, calcula el contexto de "era" (quién lidera, hace cuánto,
// quién puede pegarle el salto) y arma las noticias de esa temporada.
function evolveF1Teams(){
 const prevSorted = [...F1_TEAMS].sort((a,b)=>getF1TeamTier(b.name)-getF1TeamTier(a.name));
 const prevRanking = prevSorted.map(t=>t.name);
 const leaderName = prevRanking[0];
 const leaderStreak = (S.teamDynamics[leaderName].seasonsAtTop || 0) + 1; // temporadas que lleva liderando, incluyendo esta

 // Perseguidores cercanos (2º a 5º) reciben un empujoncito de catch-up cuando el líder ya domina hace rato.
 // Recién se nota a partir de la 3ª temporada seguida arriba, y sigue siendo chico: ayuda a acortar distancias,
 // no a decidir el campeonato por sí solo.
 const chasers = prevSorted.slice(1,5).map(t=>t.name);
 const catchUpBase = clamp((leaderStreak-2)*0.15, 0, 0.9);

 F1_TEAMS.forEach(t=>{
   const dyn = S.teamDynamics[t.name];
   const isLeader = t.name === leaderName;
   const ctx = {
     isLeader,
     leaderStreak,
     catchUpBoost: (!isLeader && chasers.includes(t.name)) ? catchUpBase*rnd() : 0,
     surpriseBoost: SURPRISE_TEAMS.includes(t.name)
   };
   evolveF1Team(dyn, t.tier, ctx);
 });

 // Recalcula el ranking post-evolución y actualiza la racha de liderazgo para la próxima temporada.
 const newLeader = [...F1_TEAMS].sort((a,b)=>getF1TeamTier(b.name)-getF1TeamTier(a.name))[0].name;
 F1_TEAMS.forEach(t=>{
   const dyn = S.teamDynamics[t.name];
   dyn.seasonsAtTop = (t.name===newLeader) ? (t.name===leaderName ? leaderStreak : 1) : 0;
 });

 S.lastConstructorNews = buildConstructorNews(prevRanking);
}
function buildConstructorNews(prevRanking){
 const ranked = [...F1_TEAMS].sort((a,b)=>getF1TeamTier(b.name)-getF1TeamTier(a.name));
 const podium = ranked.slice(0,3).map((t,i)=>{
   const prevIdx = prevRanking.indexOf(t.name);
   return {name:t.name, color:t.color, logo:t.logo, pos:i+1, delta: prevIdx - i}; // positivo = subió puestos
 });
 // El podio ya transmite quién sube y quién baja: no generamos titulares automáticos de rendimiento
 // (eso duplicaba la info del podio). Este array queda como gancho para eventos EXCEPCIONALES a futuro
 // (nueva escudería, desaparición, cambio de nombre, compra importante, etc.) — hoy siempre vacío.
 const headlines = [];
 // v3.7: fila extra con la posición del equipo del jugador, solo si NO entró en el podio de arriba
 // (si ya está en el top 3 no hace falta repetirlo en una fila aparte).
 let playerTeamRow = null;
 const pTeam = playerF1Team();
 if(pTeam){
   const idx = ranked.findIndex(t=>t.name===pTeam);
   if(idx>=3){
     const t = ranked[idx];
     const prevIdx = prevRanking.indexOf(t.name);
     playerTeamRow = {name:t.name, color:t.color, logo:t.logo, pos:idx+1, delta: prevIdx - idx};
   }
 }
 return {podium, headlines, playerTeamRow, _seq: ++_constructorNewsSeq};
}

// v: sorteo ponderado sin reemplazo. Da el orden de salida de "items" pesando cada uno según weightFn,
// recalculando el total en cada paso (así el peso relativo de los que quedan se mantiene correcto).
function weightedDrawOrder(items, weightFn){
 const pool = items.slice();
 const result = [];
 while(pool.length){
   const weights = pool.map(weightFn);
   const total = weights.reduce((a,b)=>a+b, 0);
   let r = rnd()*total;
   let idx = 0;
   for(; idx<pool.length-1; idx++){ r -= weights[idx]; if(r<=0) break; }
   result.push(pool[idx]);
   pool.splice(idx,1);
 }
 return result;
}
// v: sorteo ponderado del campeón de Mundial de Pilotos de la temporada. Toma la lista YA ordenada por
// poder (getF1StandingsEntries()) y reordena el top-N (pool) por sorteo ponderado a power², en vez de
// coronar siempre al puesto 1° — así el favorito de poder sigue ganando la mayoría de las veces, pero
// deja lugar a sorpresas ocasionales entre los de arriba. Blindaje: si el jugador está dentro del pool,
// su slot queda FIJO en la posición que le da su poder — el sorteo solo reordena a los rivales que
// comparten pool con él, nunca lo desplaza a él. Esta es la MISMA lista que después alimenta el HUD del
// Mundial de Pilotos, buildDriverNews() y el finalPos del jugador, así que reordenarla acá (en vez de
// llevar una cuenta de títulos aparte) es lo que mantiene todo coherente entre sí.
const CHAMPIONSHIP_LOTTERY_POOL = 3;
function applyChampionshipLottery(entries){
 if(!entries || entries.length <= 1) return entries;
 const pool = entries.slice(0, CHAMPIONSHIP_LOTTERY_POOL);
 const rest = entries.slice(CHAMPIONSHIP_LOTTERY_POOL);
 const playerSlot = pool.findIndex(e=>e.isPlayer);
 const rivals = pool.filter(e=>!e.isPlayer);
 if(rivals.length <= 1) return entries; // nada que sortear
 const drawnRivals = weightedDrawOrder(rivals, e=>e.power*e.power);
 const newPool = [];
 let ri = 0;
 for(let i=0;i<pool.length;i++){
   newPool.push(i===playerSlot ? pool[playerSlot] : drawnRivals[ri++]);
 }
 return [...newPool, ...rest];
}

// v3.7: Mundial de Pilotos. El juego no simula carrera por carrera para los 22 pilotos de F1 (eso ya
// lo aproxima simulateOneSeason solo para el jugador), así que la posición en el campeonato se estima
// con la misma fórmula de "perf" que ya usa simulateOneSeason (30% piloto / 70% auto, ver ahí mismo):
// el auto pesa más que el piloto, igual que en la F1 real. No es una simulación de puntos carrera a
// carrera, es un ranking por nivel esperado — coherente con cómo el resto del juego trata a los pilotos IA.
function getF1StandingsEntries(){
 const list = [];
 F1_TEAMS.forEach(t=>{
   const teamTier = getF1TeamTier(t.name);
   getTeamAIDrivers(t.name).forEach(d=>{
     list.push({id:d.name, name:d.name, nat:d.nat, team:t.name, teamColor:t.color, teamLogo:t.logo, power:d.ovr*0.30 + teamTier*0.70, isPlayer:false});
   });
 });
 const pTeam = playerF1Team();
 if(pTeam && S.f1Role!=='reserva'){ // v6: un reserva no corre, no tiene lugar en el Mundial de Pilotos
   const t = F1_TEAMS.find(x=>x.name===pTeam);
   const teamTier = getF1TeamTier(pTeam);
   const playerNat = (COUNTRIES.find(c=>c[1]===S.country)||['xx'])[0];
   const roleBonus = S.f1Role==='primero' ? 1 : 0; // v6: mismo bonus de prioridad que en simulateOneSeason
   list.push({id:'PLAYER', name:S.surname||'Vos', nat:playerNat, team:pTeam, teamColor:t?t.color:null, teamLogo:t?t.logo:null, power:(S.ovr+roleBonus)*0.30 + teamTier*0.70, isPlayer:true});
 }
 list.sort((a,b)=>b.power-a.power);
 return list;
}
// prevRanking: array de ids (nombre de piloto, o 'PLAYER') en el orden en que estaban ANTES de esta
// temporada (se captura al arranque de cada vuelta de runSeasons, antes de que nada evolucione).
// entriesOverride: v3.7.1 — si el jugador corrió en F1 esta temporada, simulateOneSeason() ya calculó
// (y guardó en lastSeasonStandings) el ranking real que además define finalPos; se lo pasamos tal cual
// para que esta tabla y la posición de la trayectoria digan siempre lo mismo. Si no vino (el jugador
// no está en F1), se recalcula acá con el estado actual (post evolución), como antes.
function buildDriverNews(prevRanking, entriesOverride){
 const entries = entriesOverride || getF1StandingsEntries();
 if(!entries.length) return null;
 const top3 = entries.slice(0,3).map((e,i)=>{
   const prevIdx = prevRanking.indexOf(e.id);
   return {...e, pos:i+1, delta: prevIdx===-1 ? 0 : prevIdx - i}; // -1 = debut en F1 esta temporada, no "subió"
 });
 // Igual que en constructores: fila aparte para el jugador solo si no entró en el podio de arriba.
 let playerRow = null;
 const playerIdx = entries.findIndex(e=>e.isPlayer);
 if(playerIdx>=3){
   const prevIdx = prevRanking.indexOf('PLAYER');
   playerRow = {...entries[playerIdx], pos:playerIdx+1, delta: prevIdx===-1 ? 0 : prevIdx - playerIdx};
 }
 return {top3, playerRow, _seq: ++_driverNewsSeq};
}

function buildTeamOfferEvent(ladderIdx, isFirst){
 const cat = LADDER[ladderIdx];
 const pool = JUNIOR_TEAMS[cat.id];
 const arch = getArchetype();
 // La reputación decide cuántos equipos se interesan (la primera oferta siempre trae 3); el arquetipo
 // puede sumar (Leyenda/Campeón múltiple) una opción extra sobre esa base.
 const offerCount = isFirst ? 3 : clamp((S.reputacion>=55 ? 3 : S.reputacion>=30 ? 2 : 1) + arch.mods.offerCountBonus, 1, 3);
 const shuffled = [...pool].sort(()=>rnd()-0.5).slice(0, Math.min(offerCount, pool.length));
 return {type:'teamOffer', category:cat, options:shuffled, isFirst:!!isFirst};
}
function buildF1OfferEvent(){
 const arch = getArchetype();
 const sorted = [...F1_TEAMS].sort((a,b)=>b.tier-a.tier);
 // Buena reputación abre puertas en equipos más grandes; mala reputación desplaza el interés hacia equipos menores.
 // El arquetipo (offerTierBias) corre ese punto de mira hacia arriba (Leyenda, Campeón...) o hacia abajo
 // (Promesa frustrada, Fracaso), sin tocar el OVR real del piloto.
 const repFactor = (S.reputacion-50)/50; // -1..1
 const targetTier = S.ovr + repFactor*8 + arch.mods.offerTierBias;
 const near = sorted.filter(t=>Math.abs(t.tier - targetTier) < 22 && t.name!==currentTeamName());
 const offerCount = clamp((S.reputacion>=65 ? 3 : S.reputacion>=35 ? 2 : 1) + arch.mods.offerCountBonus, 1, 4);
 const basePool = (near.length>=offerCount?near:sorted.filter(t=>t.name!==currentTeamName())).sort(()=>rnd()-0.5).slice(0, offerCount);
 // v6: cada oferta trae su rol (reserva/segundo/primero) -- ver deriveOfferedRole(). Los equipos top piden
 // nivel de titular antes de subirte al auto de carrera; el resto puede ofrecerte titularidad directa.
 const pool = basePool.map(t=>({...t, role: deriveOfferedRole(t)}));
 return {type:'f1Offer', options:pool};
}
// Selección ponderada por arquetipo: la mayoría de los eventos son "para todos" (peso 1), pero algunos
// tienen favor[]/disfavor[] (ver EVENTS) que los hacen más o menos probables según S.archetype. Así no
// hace falta escribir un evento distinto por arquetipo — el mismo pool de eventos cuenta historias distintas.
// v3.9: dos filtros previos al sorteo — minAge (no aparece antes de esa edad, pero tampoco es exclusivo:
// simplemente entra al pool ponderado normal desde ahí) y requiresF1 (solo eventos con sentido narrativo
// en F1, ej. mercado de pilotos). También suma weight (default 1): un evento puede pesar mucho menos que
// el resto sin tocar el mecanismo de sorteo — lo usa el evento fatal para ser una rareza real.
function buildRandomEvent(){
 const archId = S.archetype;
 const inF1 = S.ladderIdx >= LADDER.length;
 // v: TEST HOOK — con el perfil de prueba (ver isFatalTestProfile más abajo), el evento "Accidente
 // grave" aparece siempre que se llega a esta función, en vez de competir con weight:0.04 contra el
 // resto de los eventos -- así no hay que esperar al azar para testear la pantalla de final fatal.
 if(isFatalTestProfile()){
   const fatalEvent = EVENTS.find(ev=>ev.title==='Accidente grave');
   if(fatalEvent) return {type:'event', ev:fatalEvent};
 }
 const eligible = EVENTS.filter(ev=>{
   if(ev.minAge!=null && S.age < ev.minAge) return false;
   if(ev.requiresF1 && !inF1) return false;
   return true;
 });
 const pool = eligible.length ? eligible : EVENTS; // salvaguarda: nunca te quedes sin nada para mostrar
 const weighted = pool.map(ev=>{
   let w = ev.weight!=null ? ev.weight : 1;
   if(ev.favor && ev.favor.includes(archId)) w *= 2;
   else if(ev.disfavor && ev.disfavor.includes(archId)) w *= 0.5;
   return {ev, w};
 });
 const total = weighted.reduce((s,x)=>s+x.w, 0);
 let roll = rnd()*total;
 for(const x of weighted){
   if(roll < x.w) return {type:'event', ev:x.ev};
   roll -= x.w;
 }
 return {type:'event', ev:pool[pool.length-1]};
}
function buildTransferEvent(){
 const sorted = [...F1_TEAMS].sort((a,b)=>b.tier-a.tier);
 const better = sorted.filter(t=>t.tier > (F1_TEAMS.find(x=>x.name===currentTeamName())?.tier||0) && t.name!==currentTeamName());
 if(better.length===0) return buildRandomEvent();
 // Con más reputación, tenés más poder de negociación y accedés a un abanico más amplio de pretendientes.
 const poolSize = S.reputacion>=65 ? 2 : 1;
 const targetTeam = better[Math.floor(rnd()*Math.min(poolSize,better.length))];
 const target = {...targetTeam, role: deriveOfferedRole(targetTeam)};
 return {type:'transfer', target};
}

// v3.8: renovación EXPLÍCITA y rechazable. Distinta de la no-renovación silenciosa que ya decide
// checkSeatRenewal() (el equipo te baja del auto sin que el jugador tenga voz): acá el equipo ofrece
// seguir, y el jugador puede rechazar la renovación a propósito. Rechazarla no es cosmético: te saca
// del equipo actual y te manda directo al mercado real (mismo pool de ofertas que usa una no-renovación
// forzada — buildF1OfferEvent/buildTeamOfferEvent), no un simple mensaje de "lealtad".
// No decide POR SÍ SOLA cuándo aparece: la dispara opt.trigger:'renewalOffer' desde un evento (ver
// buildTriggeredPending), así el ritmo de aparición queda en manos del diseño de eventos, no hardcodeado acá.
function buildRenewalOfferEvent(){
 return {
   type:'renewalOffer',
   teamName: currentTeamName(),
   color: currentTeamColor(),
   logo: currentTeamLogo(),
   categoryLabel: currentCategoryLabel(),
   inF1: S.ladderIdx >= LADDER.length
 };
}

// v6: quinto parámetro "role" -- solo tiene sentido en F1 ('reserva' | 'segundo' | 'primero').
// Fichar como reserva NO le saca el asiento a nadie (ver f1SeatCapacity); fichar como titular sí, y por
// eso releaseSeatForPlayer() se llama siempre que el rol sea de carrera, no solo al abrir un stint nuevo
// -- así también cubre el caso de un ascenso de reserva a titular DENTRO del mismo equipo (mismo stint).
function pickTeam(teamName, color, category, logo, role){
 if(S.stints.length===0 || currentTeamName()!==teamName){
   if(S.stints.length){ S.stints[S.stints.length-1].ageEnd = S.age; }
   S.stints.push({teamName, color, logo, ageStart:S.age, ageEnd:null, races:0, wins:0, podiums:0, points:0, dnfs:0, titles:0, category});
 }
 const isF1Team = F1_TEAMS.some(t=>t.name===teamName);
 if(isF1Team && role!=='reserva'){
   // Mercado interno de pilotos (v3.0): si el jugador ficha un asiento de carrera en una escudería de
   // F1, ocupa uno de los dos, así que el piloto IA más flojo de esa escudería queda libre en el acto.
   // Si ya se había liberado antes (ej. venías de reserva y ahora te ascienden), esto no hace nada más.
   releaseSeatForPlayer(teamName);
 }
 S.f1Role = (category==='Fórmula 1') ? (role || S.f1Role || 'segundo') : null;
}

function playTeamSlash(color, cb){
 const overlay = document.createElement('div');
 overlay.className = 'team-slash';
 overlay.style.setProperty('--slash-color', color || '#E10600');
 document.body.appendChild(overlay);
 requestAnimationFrame(()=>overlay.classList.add('play'));
 setTimeout(cb, 220);
 setTimeout(()=>overlay.remove(), 600);
}

// v3.7.5: títulos ganados en el bloque de temporadas que se acaba de simular (puede haber más de uno:
// con dificultad estándar/acelerada cada decisión avanza 2 o 3 temporadas de una). Se cargan en
// simulateOneSeason() (categorías de pilotos) y en runSeasons() (constructores), y se consumen recién
// después de repintar la pantalla (ver playPendingTitleReveals(), llamada al final de applyEventChoice()),
// para que la copa gigante ya tenga adónde "volar": la fila nueva del timeline y el chip de la vitrina.
let _pendingTitleReveals = [];

function applyEventChoice(evObj, choiceKey, cardEl){
 let slashColor = currentTeamColor();
 if(evObj.type==='teamOffer'){
   const opt = evObj.options[choiceKey];
   slashColor = opt.color;
   pickTeam(opt.name, opt.color, evObj.category.name, opt.logo);
   S.pending = null;
   runSeasons();
 } else if(evObj.type==='f1Offer'){
   slashColor = evObj.options[choiceKey].color;
   const opt = evObj.options[choiceKey];
   pickTeam(opt.name, opt.color, 'Fórmula 1', opt.logo, opt.role);
   S.pending = null;
   runSeasons();
 } else if(evObj.type==='transfer'){
   if(choiceKey==='accept'){
     slashColor = evObj.target.color;
     pickTeam(evObj.target.name, evObj.target.color, 'Fórmula 1', evObj.target.logo, evObj.target.role);
     S.value = Math.round(S.value*1.15);
   } else {
     S.value = Math.round(S.value*1.05);
   }
   S.pending = null;
   runSeasons();
 } else if(evObj.type==='reserveResult' || evObj.type==='reserveStay'){
   // v6.1: tarjeta puramente informativa (el rol, si cambió, ya se aplicó al armar el evento en
   // promoteToRole()) -- un solo botón para reconocerla y seguir.
   S.pending = null;
   runSeasons();
 } else if(evObj.type==='renewalOffer'){
   if(choiceKey==='accept'){
     // Sigue en el mismo equipo: no hay fichaje que registrar, solo se sigue jugando.
     S.pending = null;
     runSeasons();
   } else {
     // Rechazo voluntario: sale del equipo actual por decisión propia y entra al mercado real,
     // el mismo que usaría una no-renovación forzada (checkSeatRenewal). Se encadena como nuevo
     // S.pending sin pasar por runSeasons(), igual que una democión o un ascenso.
     const marketEvent = evObj.inF1 ? buildF1OfferEvent() : buildTeamOfferEvent(S.ladderIdx, false);
     marketEvent.isVoluntaryExit = true;
     S.pending = marketEvent;
   }
 } else if(evObj.type==='event'){
   const opt = choiceKey==='a'?evObj.ev.a:evObj.ev.b;
   // v4: si la opción es una apuesta de OVR con % (up/upv/dnv completos) y tenemos la tarjeta
   // clickeada a mano, el resultado se "sortea" ahora mismo pero se REVELA con una animación
   // antes de aplicar nada al estado — así el jugador ve la pastilla ganadora encenderse en vez
   // de que todo cambie de golpe. Cualquier otra opción (flat, neutral, o sin cardEl disponible)
   // se resuelve al toque, como antes.
   const isGambleReveal = cardEl && !opt.fatalChance && opt.up!=null && opt.upv!=null && opt.dnv!=null;
   if(isGambleReveal){
     playGambleReveal(evObj, opt, cardEl, slashColor);
     return;
   }
   resolveEventOutcome(evObj, opt, slashColor, null);
   return;
 }
 playTeamSlash(slashColor, ()=>{ render(); playPendingTitleReveals(); });
}

// v4: anima el "sorteo" de una apuesta de OVR antes de aplicar el resultado.
//  Paso A — feedback de clic: la tarjeta elegida se comprime levemente y la opción rival se atenúa
//  para enfocar la atención en la que se está jugando.
//  Paso B — revelación: el resultado YA está decidido (se tira acá, con el mismo rnd()/archetype
//  que se usaba antes), pero recién se muestra tras una breve demora: la pastilla ganadora se
//  agranda/ilumina y la perdedora se apaga y encoge.
//  Recién cuando la revelación terminó se aplica el efecto real (applyEventEffects) y sigue el
//  flujo normal (trigger / runSeasons / transición de equipo).
function playGambleReveal(evObj, opt, cardEl, slashColor){
 const grid = cardEl.parentElement;
 const otherCard = grid ? [...grid.children].find(c=>c!==cardEl) : null;
 if(grid){ [...grid.children].forEach(c=>{ c.style.pointerEvents='none'; }); }
 cardEl.classList.add('pressed');
 if(otherCard) otherCard.classList.add('dim');

 // El resultado se decide ahora (misma fórmula que antes), pero queda guardado para revelarlo
 // recién en el siguiente paso — el jugador nunca ve un roll "en vivo", solo la revelación.
 const successChance = clamp(opt.up * getArchetype().mods.eventSuccessMult, 4, 96);
 const success = rnd()*100 < successChance;
 const winnerRow = cardEl.querySelector(success ? '.outcome-row.up' : '.outcome-row.down');
 const loserRow = cardEl.querySelector(success ? '.outcome-row.down' : '.outcome-row.up');

 setTimeout(()=>{
   cardEl.classList.remove('pressed');
   cardEl.classList.add('rolling');
   if(winnerRow) winnerRow.classList.add('winner');
   if(loserRow) loserRow.classList.add('loser');
 }, 220);

 setTimeout(()=>{
   resolveEventOutcome(evObj, opt, slashColor, success);
 }, 1050);
}

// v: TEST HOOK — con esta identidad exacta (nacionalidad + apellido + número de piloto), el evento
// "Accidente grave" aparece siempre (ver buildRandomEvent) y, si elegís "Volver a competir", la
// chance de fallecer pasa de 5% a 100% (ver resolveEventOutcome) -- para poder testear la pantalla y
// el flujo de final fatal sin depender del azar. "No volver a pista" (la otra opción del evento) sigue
// siendo segura -- el hook no te obliga a elegir la opción riesgosa. Solo afecta a esta configuración
// puntual; cualquier otra identidad sigue jugando con las probabilidades normales del juego.
function isFatalTestProfile(){
 return S.country==='Malasia' && S.surname==='12345' && String(S.number)==='67';
}

// v4: aplica de verdad el resultado de una opción de evento (ya sea al toque o después de la
// animación de revelación) y sigue el flujo normal del juego. predeterminedSuccess viene definido
// SOLO cuando ya se jugó la apuesta en playGambleReveal — evita volver a tirar el dado.
function resolveEventOutcome(evObj, opt, slashColor, predeterminedSuccess){
 // 1) Riesgo de desenlace fatal: se evalúa primero y, si sale, corta acá — ignora cualquier otro
 //    efecto (gamble, reputación, valor, trigger) que la opción pudiera declarar.
 if(opt.fatalChance && (isFatalTestProfile() || rnd()*100 < opt.fatalChance)){
   S.careerEndReason = 'fatal';
   pushTimelineRow({races:0, wins:0, podiums:0, points:0, finalPos:null, fatal:true});
   finalizeRetirement();
   playTeamSlash(slashColor, ()=>{ render(); });
   return;
 }

 if(!opt.neutral){
   // Gamble de OVR: si ya se decidió en playGambleReveal, se reusa ese resultado; si no (opción
   // sin animación, ej. porque no había cardEl disponible), se tira acá como antes.
   if(opt.up!=null && (opt.upv!=null || opt.dnv!=null)){
     const success = predeterminedSuccess!=null ? predeterminedSuccess
       : rnd()*100 < clamp(opt.up * getArchetype().mods.eventSuccessMult, 4, 96);
     applyEventEffects({ovrDelta: success?opt.upv:opt.dnv});
   }
   // Efectos garantizados: no dependen de ningún roll (útiles para cosas como "criticar públicamente
   // al equipo", donde el golpe a la reputación es seguro, no una apuesta).
   applyEventEffects({
     ovrDelta: opt.up!=null ? null : opt.ovrDelta, // si ya hubo apuesta de OVR arriba, no se pisa
     repDelta: opt.repDelta,
     valueMult: opt.valueMult,
     valueDelta: opt.valueDelta
   });
 }

 if(opt.trigger){
   // La opción encadena a otro sistema (por ahora, solo 'renewalOffer') en vez de cerrar el turno.
   S.pending = buildTriggeredPending(opt.trigger);
 } else {
   S.pending = null;
   runSeasons();
 }
 playTeamSlash(slashColor, ()=>{ render(); playPendingTitleReveals(); });
}

let lastSeasonStats = {races:0,wins:0,podiums:0};
let lastBlockCache = {races:0,wins:0,podiums:0};
// v3.7.1: snapshot del ranking real de getF1StandingsEntries() tomado DENTRO de simulateOneSeason()
// (con el S.ovr del jugador ya actualizado, pero antes de evolveF1Teams()/evolveAIDrivers()). Se usa
// para que finalPos y el Mundial de Pilotos (buildDriverNews) muestren siempre la misma posición.
let lastSeasonStandings = null;

// v: al llegar a los 40, la carrera no se corta siempre ahí -- un piloto que todavía rinde a buen nivel
// puede estirarla unos años más. El límite se fija UNA sola vez, con el OVR que el jugador tiene justo
// al cumplir 40 (no se vuelve a recalcular después, aunque el OVR seguiría moviéndose esos años extra).
function computeAgeRetireLimit(ovr){
 if(ovr >= 85) return 44;
 if(ovr >= 80) return 43;
 if(ovr >= 75) return 41;
 return 40;
}

// simulate a block of seasons (length = difficulty step)
function runSeasons(){
 lastBlockCache = {races:0,wins:0,podiums:0,points:0,dnfs:0,finalPos:null};
 const step = DIFF[S.difficulty].step;
 for(let s=0; s<step; s++){
   if(S.age >= (S.ageRetireLimit || 40)) break;
   const wasInF1 = S.ladderIdx >= LADDER.length;
   const teamThisSeason = wasInF1 ? currentTeamName() : null;
   // v3.7: standings de pilotos ANTES de que nada de esta temporada evolucione (ovr de IA, ovr del
   // jugador, tier de equipos). Es el "punto de partida" contra el que se mide el delta ▲▼ del Mundial.
   const prevDriverEntries = getF1StandingsEntries();
   const prevDriverRanking = prevDriverEntries.map(e=>e.id);
   const wasReserve = wasInF1 && S.f1Role==='reserva';
   // v6: un piloto reserva no corre -- su temporada se resuelve con test days/sustitución, no con
   // simulateOneSeason(). Todo lo demás (parrilla, pilotos IA, mercado interno) sigue moviéndose igual.
   if(wasReserve) simulateReserveSeason(); else simulateOneSeason();
   evolveF1Teams(); // la parrilla de F1 avanza un paso cada temporada, esté el jugador en F1 o no
   evolveAIDrivers(); // los pilotos IA de F1 también evolucionan un paso cada temporada (v3.0)
   // v: "Historia" -- acredita el campeón de Mundial de Pilotos de ESTA temporada a un piloto IA (el
   // título del jugador ya se suma más abajo vía S.titles.f1, en simulateOneSeason). Si el jugador corrió
   // como titular, usamos el mismo ranking (ya con el sorteo aplicado) que decidió su finalPos
   // (lastSeasonStandings); si no (categorías juniors o reserva) no hay carrera de F1 realmente simulada
   // esta temporada, así que aproximamos con el ranking de poder tomado ANTES de esta vuelta
   // (prevDriverEntries) -- misma idea que ya usa el resto del juego para estimar posiciones sin simular
   // rivales carrera por carrera -- pasado también por el mismo sorteo ponderado (applyChampionshipLottery)
   // para que el campeón acreditado acá sea siempre el mismo que después ve el jugador en el Mundial de
   // Pilotos y en las noticias (buildDriverNews), sin cálculos paralelos.
   const seasonChampEntries = (wasInF1 && !wasReserve && lastSeasonStandings) ? lastSeasonStandings : applyChampionshipLottery(prevDriverEntries);
   if(seasonChampEntries && seasonChampEntries.length){
     const champ = seasonChampEntries[0];
     if(!champ.isPlayer && S.aiDrivers[champ.id]){
       S.aiDrivers[champ.id].f1Titles = (S.aiDrivers[champ.id].f1Titles||0) + 1;
     }
   }
   if(wasInF1 && !wasReserve) updatePlayerF1Role(); // v6: recalcula Nº1/Nº2 contra el compañero YA evolucionado
   evaluateAISeatLosses(); // el mercado interno decide qué pilotos IA pierden su asiento (v3.0)
   replenishReservePool(); // si el banco de libres quedó corto (retiros, fichajes), entra cantera nueva (v3.4)
   S.seasonNum = (S.seasonNum||0) + 1; // v3.6: cuenta temporadas jugadas, independiente de la edad del jugador
   injectLateGamePool(); // v3.6: a partir de la temporada 10, se suma el banco de refuerzo tardío
   fillMarketVacancies();  // y quién cubre los asientos vacantes, incluido el que dejó el jugador al firmar
   // v: antes acá se pasaba lastSeasonStandings (null si el jugador no corría en F1 esa temporada), lo que
   // hacía que buildDriverNews recalculara getF1StandingsEntries() de cero -- después de evolveF1Teams()/
   // evolveAIDrivers() -- perdiendo el resultado del sorteo ponderado de más arriba. Pasamos siempre
   // seasonChampEntries para que el podio de noticias y el campeón acreditado a Historia sean la MISMA lista.
   S.lastDriverNews = buildDriverNews(prevDriverRanking, seasonChampEntries);
   // Campeonato de Constructores: si el equipo del jugador termina 1º en el podio de esa temporada, suma trofeo.
   // Solo lee el resultado ya calculado por evolveF1Teams/buildConstructorNews; no toca esa lógica.
   // (un piloto reserva no corre, así que no suma título de constructores por más que su equipo salga campeón)
   if(wasInF1 && !wasReserve && S.lastConstructorNews && S.lastConstructorNews.podium[0] && S.lastConstructorNews.podium[0].name === teamThisSeason){
     S.titles.constructors++;
     const stC = S.stints[S.stints.length-1];
     stC.titles = (stC.titles||0) + 1;
     addStintTitle(stC, 'constructors');
     _pendingTitleReveals.push('constructors');
   }
   S.age += 1;
   // v: al cumplir 40 se fija el límite real de esta carrera (según el OVR de ESTE momento -- ver
   // computeAgeRetireLimit). Se calcula una sola vez: si ya estaba fijado (partida cargada a mitad de
   // camino, o llamada repetida), no se vuelve a tocar.
   if(S.age===40 && !S.ageRetireLimit) S.ageRetireLimit = computeAgeRetireLimit(S.ovr);
   lastBlockCache.races += lastSeasonStats.races;
   lastBlockCache.wins += lastSeasonStats.wins;
   lastBlockCache.podiums += lastSeasonStats.podiums;
   lastBlockCache.points += lastSeasonStats.points;
   lastBlockCache.dnfs += lastSeasonStats.dnfs;
   lastBlockCache.finalPos = lastSeasonStats.finalPos; // se muestra la posición de la última temporada del bloque
   // v6: el riesgo de asiento de un reserva no pasa por checkSeatRenewal (no tiene asiento de carrera
   // que perder) -- lo resuelve checkReserveSeasonOutcome() con su propia matriz de probabilidades.
   const seatEvent = wasReserve ? checkReserveSeasonOutcome() : checkSeatRenewal();
   if(seatEvent){
     if(seatEvent.type==='careerEnd'){
       S.careerEndReason = seatEvent.reason;
       S.retired = true;
       S.pending = null;
     } else {
       S._forcedDemotion = seatEvent;
     }
   }
   if(S.retired || S._forcedDemotion) break; // el mercado te dejó sin asiento: se corta el bloque, hay que resolverlo ya
   maybePromote();
   if(S.age>=(S.ageRetireLimit||40)) break;
 }
 pushTimelineRow();
 if(S.retired){ finalizeRetirement(); return; }
 if(S.age>=(S.ageRetireLimit||40)){ finalizeRetirement(); return; }
 if(S._forcedDemotion){
   S.pending = S._forcedDemotion;
   S._forcedDemotion = null;
 } else if(S._pendingPromotion){
   S.pending = S._pendingPromotion;
   S._pendingPromotion = null;
 } else if(S.f1Role==='reserva'){
   // v6.1 FIX: antes esto dejaba S.pending=null y la pantalla de espera no tiene botón -- el jugador
   // quedaba sin forma de avanzar. Ahora arma una tarjeta con el recap de la temporada (mismo componente
   // que reserveResult) y un botón para pasar a la siguiente temporada de reserva.
   S.pending = {type:'reserveStay', icon:'🧪', title:'Piloto Reserva',
     desc:`Seguís sumando kilómetros de test y simulador en ${currentTeamName()}, a la espera de tu oportunidad como titular.`};
 } else if(S.ladderIdx>=LADDER.length && rnd()<clamp((0.10 + (S.reputacion/100)*0.24) * getArchetype().mods.transferChanceMult, 0.04, 0.40)){
   S.pending = buildTransferEvent();
 } else {
   S.pending = buildRandomEvent();
 }
}

function simulateOneSeason(){
 const inF1 = S.ladderIdx >= LADDER.length;
 const cat = inF1 ? null : LADDER[S.ladderIdx];
 const teamTier = inF1 ? getF1TeamTier(currentTeamName()) : (cat.tierBase + rnd()*10);
 const races = inF1 ? 22 : cat.races;
 const fieldSize = inF1 ? F1_FIELD_SIZE : (FIELD_SIZE[cat.id] || 28);

 // Motor de temporada: el nivel del auto pesa mucho más que el piloto (≈70% equipo / 30% piloto),
 // igual que en la F1 real. Esto solo define resultados de carrera (victorias/podios/puntos/posición),
 // no toca el cálculo de reputación ni de evolución del OVR (que siguen abajo, sin cambios).
 // v6: ser Piloto Nº1 da prioridad de desarrollo del auto -- un pequeño +1 OVR efectivo SOLO acá (no
 // se guarda en S.ovr ni afecta su evolución real). Piloto Nº2 corre en igualdad de condiciones.
 const roleBonus = (inF1 && S.f1Role==='primero') ? 1 : 0;
 const perf = (S.ovr+roleBonus)*0.30 + teamTier*0.70;
 const winProb = clamp(((perf-74)/110), 0.008, 0.55);
 const podProb = clamp(((perf-50)/95), 0.02, 0.8);
 const pointsProb = clamp(((perf-38)/80), 0.03, 0.65); // termina 4º-10º
 const dnfProb = clamp(0.10 - (teamTier-55)/500, 0.03, 0.16); // autos mejores = más fiables

 let wins=0, podiums=0, points=0, dnfs=0;
 for(let r=0;r<races;r++){
   if(rnd() < dnfProb){ dnfs++; continue; }
   const roll = rnd();
   if(roll < winProb){
     wins++; podiums++; points += POINTS_TABLE[0];
   } else if(roll < winProb+podProb){
     podiums++;
     points += rnd() < 0.55 ? POINTS_TABLE[1] : POINTS_TABLE[2];
   } else if(roll < winProb+podProb+pointsProb){
     points += POINTS_TABLE[3 + Math.floor(rnd()*7)]; // posiciones 4ª a 10ª
   }
 }
 lastSeasonStats = {races, wins, podiums, points, dnfs, finalPos:null};

 S.careerRaces += races; S.careerWins += wins; S.careerPodiums += podiums;
 S.careerPoints += points; S.careerDnfs += dnfs;
 const st = S.stints[S.stints.length-1];
 st.races += races; st.wins += wins; st.podiums += podiums; st.points += points; st.dnfs += dnfs;

 // --- Rendimiento real vs. lo que el auto hacía esperar (motor de Reputación + evolución de OVR) ---
 // señal principal: cuánto mejor o peor sos que el nivel de tu auto (lo que realmente maneja tus chances de ganar/podiar)
 const skillMargin = S.ovr - teamTier;
 let perfDelta = clamp(skillMargin/32, -1, 1);
 // matiz: la cosecha real de resultados de la temporada (suerte, rachas, choques) empuja un poco el número, sin dominarlo
 const seasonScore = races>0 ? (wins*3+podiums*1.2)/races : 0;
 const baseWinProb = clamp(((teamTier-74)/110), 0.008, 0.55); // lo que ganaría/podiaría un piloto que iguala exactamente a su auto
 const basePodProb = clamp(((teamTier-50)/95), 0.02, 0.8);
 const expectedSeasonScore = baseWinProb*3 + basePodProb*1.2;
 // "banda muerta": con probabilidades bajas (autos flojos, pocas carreras) sacar 0 puntos en una temporada es normal,
 // no una sorpresa. Sin esta banda, la varianza de una sola temporada sesga todo hacia abajo sistemáticamente.
 const seasonDiff = seasonScore - expectedSeasonScore;
 const deadband = expectedSeasonScore*0.7 + 0.05;
 let luckDelta = 0;
 if(seasonDiff > deadband) luckDelta = clamp((seasonDiff-deadband)*2.2, 0, 0.3);
 else if(seasonDiff < -deadband) luckDelta = clamp((seasonDiff+deadband)*2.2, -0.3, 0);
 // -1 = catastrófico (mucho peor de lo esperado) ... 0 = cumplió lo esperado ... +1 = heroico (muy por encima)
 perfDelta = clamp(perfDelta*0.8 + luckDelta, -1, 1);

 // El arquetipo no cambia el resultado de las carreras (eso ya se decidió arriba), pero sí cuánto pesa ese
 // resultado sobre reputación/OVR: una Leyenda "aprovecha mejor" una gran temporada (perfPosMult) y se
 // recupera más rápido de una mala (perfNegMult amortigua lo negativo); en un Fracaso pasa lo inverso.
 const archPerf = getArchetype().mods;
 if(perfDelta > 0) perfDelta = clamp(perfDelta * archPerf.perfPosMult, -1, 1);
 else if(perfDelta < 0) perfDelta = clamp(perfDelta * archPerf.perfNegMult, -1, 1);

 // Reputación: sube o baja según si superaste o decepcionaste la expectativa del auto, no según ganar en sí
 S.reputacion = clamp(S.reputacion + calcRepDelta(perfDelta), 0, 100);

 // OVR: evoluciona según edad/pico, potencial oculto, velocidad de crecimiento y el rendimiento real
 S.ovr = clamp(S.ovr + calcOvrDelta(perfDelta), 30, Math.min(99, S.potencialMaximo));
 S.peakOvr = Math.max(S.peakOvr, Math.round(S.ovr));

 // value formula (steep curve), declines naturally with lower ovr near retirement
 const base = Math.pow(Math.max(S.ovr,35)/50, 9.5) * 100000;
 const ageFactor = S.age > 33 ? clamp(1 - (S.age-33)*0.09, 0.15, 1) : 1;
 S.value = Math.round(base*ageFactor);
 S.peakValue = Math.max(S.peakValue, S.value);

 // Posición final en el campeonato: se estima comparando tu "perf" (auto+piloto) contra el nivel
 // medio de la grilla de esa categoría, con algo de variación por suerte/rachas (perfDelta) y azar.
 // Es simple (no simula al resto de los pilotos) pero mantiene coherencia: mejor auto+piloto = mejor posición,
 // y ganar carreras siempre te deja arriba de la tabla.
 const catMean = inF1 ? 76 : (cat.tierBase + 6);
 const catStd = inF1 ? 13 : 11;
 let percentile = sigmoid((perf-catMean)/catStd);
 percentile = clamp(percentile + perfDelta*0.12 + (rnd()-0.5)*0.08, 0.02, 0.98);
 let finalPos = Math.round(1 + (1-percentile)*(fieldSize-1));
 if(wins>0) finalPos = Math.min(finalPos, Math.max(1, 4-wins));
 finalPos = clamp(finalPos, 1, fieldSize);

 // v3.7.1: en F1 no nos quedamos con la estimación por percentil de arriba (es genérica y no conoce
 // a los pilotos IA reales). En F1 SÍ existe una grilla real (getF1StandingsEntries()), así que la
 // posición final se toma directamente de ese ranking — con el S.ovr del jugador ya actualizado arriba,
 // y ANTES de que evolveF1Teams()/evolveAIDrivers() muevan a los rivales para la próxima temporada.
 // Esto es lo que garantiza que "POS" en la trayectoria y la tabla del Mundial de Pilotos coincidan.
 // Fuera de F1 no hay lista de rivales real todavía, así que ahí se sigue usando el percentil de arriba.
 if(inF1){
   // v: sorteo ponderado del campeón (ver applyChampionshipLottery) — reordena el top-3 real por poder;
   // el jugador queda blindado en su slot si está dentro del pool, así que esto nunca mueve su finalPos.
   lastSeasonStandings = applyChampionshipLottery(getF1StandingsEntries());
   const idx = lastSeasonStandings.findIndex(e=>e.isPlayer);
   if(idx>=0) finalPos = clamp(idx+1, 1, fieldSize);
 } else {
   lastSeasonStandings = null;
 }
 lastSeasonStats.finalPos = finalPos;
 st.finalPos = finalPos;
 S.bestFinalPos = S.bestFinalPos===null ? finalPos : Math.min(S.bestFinalPos, finalPos);

 // championship titles per category + individual awards (F1 has richer award set)
 const catId = inF1 ? 'f1' : cat.id;
 const isChampion = finalPos === 1;
 if(inF1){
   if(isChampion){ S.titles.f1++; st.titles++; addStintTitle(st,'f1'); _pendingTitleReveals.push('f1'); }
   else if(finalPos===2){ S.awards.runnerup++; }
   if(rnd() < winProb*1.4) S.awards.fastlap++;
   if(rnd() < 0.05 + winProb*0.5) S.awards.driver++;
 } else {
   if(isChampion){ S.titles[catId]++; st.titles++; addStintTitle(st,catId); _pendingTitleReveals.push(catId); }
   if(S.ladderIdx===0 && S.seasonsInCategory===0 && (wins+podiums) > races*0.35){
     S.awards.rookie++;
   }
 }
 S.seasonsInCategory++;
}

// ΔOVR según la fase de la carrera (desarrollo / pique / declive), el potencial oculto y el rendimiento real.
// Versión genérica: recibe cualquier "piloto" con {age, edadPico, velocidadCrecimiento, potencialMaximo, ovr},
// así el jugador y los pilotos IA de F1 comparten exactamente el mismo motor de evolución (v3.0).
function calcOvrDeltaGeneric(driver, perfDelta){
 const age = driver.age;
 const peak = driver.edadPico;
 const vel = driver.velocidadCrecimiento;
 const margen = Math.max(driver.potencialMaximo - driver.ovr, 0); // cuánto le queda para llegar a su techo
 let delta;
 if(age < peak-2){
   // Desarrollo: el margen hacia el potencial se libera más rápido cuanto mejor rindas frente a tu auto
   const base = (margen*0.06 + 0.35) * vel;
   const mult = clamp(1 + perfDelta*1.3, 0.15, 1.9);
   delta = base*mult;
 } else if(age <= peak+2){
   // Pique/Cúspide: se estabiliza en su nivel personal, solo lo mueve el rendimiento de la temporada
   delta = perfDelta * 2.1 * vel;
 } else {
   // Declive: tendencia a bajar; una gran temporada la atenúa, una mala la acelera
   const yearsPast = age - (peak+2);
   const baseDecline = -(0.55 + yearsPast*0.22);
   delta = baseDecline * clamp(1 - perfDelta*0.65, 0.35, 1.7);
 }
 return delta;
}
function calcOvrDelta(perfDelta){
 return calcOvrDeltaGeneric(S, perfDelta);
}
// ΔReputación: no depende de ganar, depende de superar (o no) la expectativa del auto
function calcRepDelta(perfDelta){
 // La reputación es prestigio de paddock, no un marcador que deba moverse fuerte temporada a temporada:
 // se mueve lento, así una mala temporada no arruina una carrera ni una gran temporada te vuelve estrella de la nada.
 let lo, hi;
 if(perfDelta > 0.4){ lo=4; hi=7; }          // heroico: auto de fondo de tabla, cosechaste resultados igual
 else if(perfDelta > 0.12){ lo=1; hi=2; }    // cumplidor: rendiste acorde (o algo mejor) a lo que pedía el auto
 else if(perfDelta > -0.12){ lo=-1; hi=1; }  // parejo: ni sorprendió ni decepcionó
 else if(perfDelta > -0.4){ lo=-5; hi=-3; }  // decepcionante: tenías auto para más y no lo mostraste
 else { lo=-9; hi=-6; }                      // catastrófico: temporada para el olvido con buen material
 return Math.round(lo + rnd()*(hi-lo));
}

/* =====================================================
   CONSECUENCIAS DE EVENTOS (v3.8)
   - applyEventEffects() es el único lugar que escribe OVR/reputación/valor por fuera de la simulación
     de temporada (simulateOneSeason/calcOvrDelta/calcRepDelta). Cualquier sistema que necesite mover
     estas tres variables "de superficie" a partir de una decisión puntual (un evento, un rechazo de
     renovación, lo que sea) pasa por acá, así los clamps quedan en un solo lugar.
   - No inventa una cuarta variable para "relación con el equipo": por decisión explícita, esa relación
     se modela reusando S.reputacion (ver charla). Un evento que criticá al equipo o un evento de buena
     onda con el equipo también entran por acá, moviendo repDelta.
===================================================== */
function applyEventEffects(eff){
 if(!eff) return;
 if(eff.ovrDelta){
   S.ovr = clamp(S.ovr + eff.ovrDelta, 30, Math.min(99, S.potencialMaximo||99));
 }
 if(eff.repDelta){
   S.reputacion = clamp(S.reputacion + eff.repDelta, 0, 100);
 }
 if(eff.valueMult){
   S.value = Math.round(S.value * eff.valueMult);
 }
 if(eff.valueDelta){
   S.value = Math.max(0, Math.round(S.value + eff.valueDelta));
 }
}

// Deriva el siguiente S.pending a partir de un "trigger" declarado en una opción de evento (opt.trigger).
// Mismo patrón que ya usan las demociones/promociones automáticas (S._forcedDemotion / S._pendingPromotion
// en runSeasons()/checkSeatRenewal()/maybePromote()): el evento se arma ahora pero se resuelve recién en
// la próxima decisión del jugador, sin pasar por runSeasons().
function buildTriggeredPending(trigger){
 if(trigger==='renewalOffer') return buildRenewalOfferEvent();
 if(trigger==='f1Market'){
   // buildF1OfferEvent() por defecto arma la tarjeta de "debut en F1"; acá el piloto ya está en la
   // categoría, así que se pide el mismo texto que ya usa checkSeatRenewal() para una no-renovación.
   const ev = buildF1OfferEvent();
   ev.isNonRenewal = true;
   return ev;
 }
 if(trigger==='demoteToF2'){
   // Mismo camino que toma checkSeatRenewal() cuando el mercado de F1 no te quiere: bajás al último
   // escalón junior (F2) y se te arma una oferta de equipos de esa categoría, marcada como democión.
   S.ladderIdx = LADDER.length-1;
   S.seasonsInCategory = 0;
   S.f1Role = null;
   const ev = buildTeamOfferEvent(S.ladderIdx, false);
   ev.isDemotion = true;
   return ev;
 }
 return buildRandomEvent();
}

// v: RETIRADO — el retiro forzado por estancamiento en categorías junior se sacó del juego. El único
// retiro forzado que queda es el accidente fatal (ver resolveEventOutcome/opt.fatalChance). El jugador
// decide cuándo cerrar su carrera con el botón de retiro voluntario, siempre disponible (endCareerNow()).


// v6: un piloto RESERVA no arriesga su asiento por esta vía -- no tiene un asiento de carrera que
// perder. Su futuro (seguir de reserva, ascender, salir al mercado o quedar libre) lo decide
// checkReserveSeasonOutcome() al cierre de cada temporada de reserva, con su propia matriz de probabilidades.
function checkSeatRenewal(){
 if(S.f1Role==='reserva') return null;
 const arch = getArchetype();
 // Arquetipos "de elite" (Leyenda / Campeón múltiple / Campeón) son los únicos que pueden sostener
 // una era larga en el mismo equipo sin que el mercado empiece a dudar de vos. El resto, no: por más
 // que la reputación esté alta, quedarte MUCHOS años en el mismo asiento sin ser de esa categoría
 // empieza a sumar riesgo aparte (el equipo prueba sangre nueva, se le acaba la paciencia).
 const eliteTier = arch.id==='leyenda' || arch.id==='campeonMultiple' || arch.id==='campeon';
 const curStint = S.stints[S.stints.length-1];
 const tenure = curStint ? (S.age - curStint.ageStart) : 0;
 const tenureRisk = eliteTier
   ? clamp((tenure-10)*0.010, 0, 0.05)   // recién después de 10 años, y muy poco
   : clamp((tenure-5)*0.035, 0, 0.30);   // a partir del año 6 en el mismo equipo, sube fuerte

 // Perder el asiento debe ser una excepción, no una mecánica frecuente: probabilidad baja incluso con reputación pésima.
 // El arquetipo (seatRiskMult) inclina esa excepción: una Leyenda casi nunca se queda sin asiento por las
 // dudas del mercado; un Fracaso o una Promesa frustrada corren bastante más riesgo con la misma reputación.
 const baseRisk = clamp((35 - S.reputacion)/140, 0, 0.10);
 const riskFactor = clamp((baseRisk * arch.mods.seatRiskMult) + tenureRisk, 0, 0.45);
 if(rnd() >= riskFactor) return null;

 if(S.ladderIdx >= LADDER.length){
   // No te renuevan en tu escudería de F1. Si hay algún equipo de F1 interesado (según tu reputación), seguís ahí.
   const curTier = F1_TEAMS.find(t=>t.name===currentTeamName())?.tier || 60;
   const willing = F1_TEAMS.filter(t=>t.tier <= curTier-4 && t.name!==currentTeamName());
   if(willing.length>0 && S.reputacion>=15){
     const pool = willing.sort((a,b)=>b.tier-a.tier).slice(0, S.reputacion>=40?2:1).map(t=>({...t, role: deriveOfferedRole(t)}));
     return {type:'f1Offer', options:pool, isNonRenewal:true};
   }
   // Nadie en F1 te quiere: te toca reconstruirte en F2.
   S.ladderIdx = LADDER.length-1;
   S.seasonsInCategory = 0;
   S.f1Role = null;
   const ev = buildTeamOfferEvent(S.ladderIdx, false);
   ev.isDemotion = true;
   return ev;
 }
 if(S.ladderIdx === 0){
   // Ya estabas en F4, el primer escalón: no hay a dónde bajarte, así que te reconstruís ahí mismo con
   // otro equipo (igual que una democión normal). v: antes esto terminaba la carrera por reputación baja
   // -- se sacó: el único retiro forzado que queda en el juego es el accidente fatal.
   const ev = buildTeamOfferEvent(S.ladderIdx, false);
   ev.isDemotion = true;
   return ev;
 }
 // No te renuevan en tu categoría actual: bajás un escalón a reconstruirte con otro equipo.
 S.ladderIdx = Math.max(0, S.ladderIdx-1);
 S.seasonsInCategory = 0;
 const ev = buildTeamOfferEvent(S.ladderIdx, false);
 ev.isDemotion = true;
 return ev;
}

function maybePromote(){
 if(S.ladderIdx >= LADDER.length) return; // already in F1
 const cat = LADDER[S.ladderIdx];
 const readyByTime = S.seasonsInCategory >= 1;
 const readyByForm = S.ovr >= (cat.tierBase - 6);
 if(!(readyByTime && readyByForm)) return;
 // Estar listo por rendimiento no garantiza la llamada: la reputación es lo que abre (o no) la puerta del mercado.
 const marketChance = clamp(0.55 + (S.reputacion-50)/140, 0.35, 0.9);
 if(rnd() < marketChance){
   S.ladderIdx++;
   S.seasonsInCategory = 0;
   if(S.ladderIdx < LADDER.length){
     S._pendingPromotion = buildTeamOfferEvent(S.ladderIdx, false);
   } else {
     S._pendingPromotion = buildF1OfferEvent();
   }
 }
}

/* =====================================================
   TEMPORADA DE PILOTO RESERVA (v6)
   - Un piloto reserva no corre carreras: en vez de simulateOneSeason(), cada temporada se resuelve con
     2 eventos de test/simulador (siempre) + 1 evento de sustitución opcional (30% de probabilidad, con
     mucho más impacto en reputación). Se resuelven automáticamente con rnd(), igual que ya hace el
     juego con las 22 carreras de una temporada de piloto titular o con la evolución de los pilotos IA:
     no hay 22 clics para correr una temporada, tampoco hace falta uno por cada test day.
   - El resultado (éxitos vs. fallos) queda en S.reserveLog y se muestra en S.lastReserveRecap para que
     la pantalla lo cuente; y alimenta la matriz de probabilidades de checkReserveSeasonOutcome(), que
     decide al cierre de la temporada si el equipo asciende al jugador, lo mantiene, le llegan ofertas
     de otros equipos, o queda libre.
===================================================== */
const RESERVE_TEST_EVENTS = [
 {label:'Día de test privado', icon:'🧪'},
 {label:'Sesión de simulador', icon:'🖥️'},
 {label:'Prueba de neumáticos', icon:'🔧'},
 {label:'Filming day promocional', icon:'🎥'},
 {label:'Rueda libre en pretemporada', icon:'🏎️'}
];
const RESERVE_SUB_EVENT = {label:'Sustituís al titular en un GP', icon:'🚨'};

function simulateReserveSeason(){
 const teamName = currentTeamName();
 const teamTier = getF1TeamTier(teamName);
 const arch = getArchetype();
 if(!S.reserveLog) S.reserveLog = {successes:0, fails:0, total:0};
 const recap = {teamName, tests:[], substitution:null};

 // Dos eventos de test/simulador, siempre. Como con la apuesta de OVR de los eventos normales, el
 // arquetipo (eventSuccessMult) infla o achica la chance de que salgan bien.
 for(let i=0;i<2;i++){
   const ev = RESERVE_TEST_EVENTS[Math.floor(rnd()*RESERVE_TEST_EVENTS.length)];
   const successChance = clamp((45 + (S.ovr-teamTier)*1.1 + (S.reputacion-50)*0.3) * arch.mods.eventSuccessMult, 4, 96);
   const success = rnd()*100 < successChance;
   if(success){
     S.ovr = clamp(S.ovr + (0.6+rnd()*1.2), 30, Math.min(99, S.potencialMaximo));
     S.reputacion = clamp(S.reputacion + randRange(1,3), 0, 100);
     S.reserveLog.successes++;
   } else {
     S.reputacion = clamp(S.reputacion - randRange(1,3), 0, 100);
     S.reserveLog.fails++;
   }
   S.reserveLog.total++;
   recap.tests.push({label:ev.label, icon:ev.icon, success});
 }
 // Sustitución: rara (30%) pero pesa el doble en la evaluación de fin de temporada -- un GP real
 // sustituyendo al titular dice mucho más que un test privado.
 if(rnd() < 0.30){
   const successChance = clamp((40 + (S.ovr-teamTier)*1.3 + (S.reputacion-50)*0.25) * arch.mods.eventSuccessMult, 4, 96);
   const success = rnd()*100 < successChance;
   if(success){
     S.ovr = clamp(S.ovr + (1.5+rnd()*2), 30, Math.min(99, S.potencialMaximo));
     S.reputacion = clamp(S.reputacion + randRange(6,10), 0, 100);
     S.reserveLog.successes += 2;
   } else {
     S.reputacion = clamp(S.reputacion - randRange(4,8), 0, 100);
     S.reserveLog.fails += 2;
   }
   S.reserveLog.total += 2;
   recap.substitution = {label:RESERVE_SUB_EVENT.label, icon:RESERVE_SUB_EVENT.icon, success};
 }

 // Crecimiento base, leve a propósito (ver charla de diseño): un reserva progresa más lento que un
 // titular o incluso que un libre de cantera -- la ganancia real de la temporada viene de los eventos
 // de arriba, no de acá.
 const margen = Math.max((S.potencialMaximo||S.ovr) - S.ovr, 0);
 S.ovr = clamp(S.ovr + margen*0.02, 30, Math.min(99, S.potencialMaximo));
 S.peakOvr = Math.max(S.peakOvr, Math.round(S.ovr));

 const base = Math.pow(Math.max(S.ovr,35)/50, 9.5) * 100000;
 const ageFactor = S.age > 33 ? clamp(1 - (S.age-33)*0.09, 0.15, 1) : 1;
 S.value = Math.round(base*ageFactor);
 S.peakValue = Math.max(S.peakValue, S.value);

 S.lastReserveRecap = recap;
 lastSeasonStats = {races:0, wins:0, podiums:0, points:0, dnfs:0, finalPos:null};
}

// El equipo asciende al jugador dentro de su propio roster (sin fichaje nuevo, mismo stint) --
// se aplica el rol al toque y se muestra como una tarjeta informativa de un solo botón (ver
// decisionAreaHTML/'reserveResult'), coherente con cómo el resto del juego anuncia ascensos automáticos.
function promoteToRole(role){
 pickTeam(currentTeamName(), currentTeamColor(), 'Fórmula 1', currentTeamLogo(), role);
 return {type:'reserveResult', icon:'📈',
   title: role==='primero' ? '¡Ascenso a Piloto Nº1!' : 'Ascenso a Piloto Nº2',
   desc: `${currentTeamName()} decidió confiar en vos como ${ROLE_LABEL[role]} para la próxima temporada.`};
}
// Otros equipos se interesan (buen o regular año de reserva) -- reusa el mismo formato que un debut/
// no-renovación de F1, cada oferta con su rol ya etiquetado por deriveOfferedRole().
function buildReserveMarketOffers(quality){
 let sorted = [...F1_TEAMS].filter(t=>t.name!==currentTeamName()).sort((a,b)=>b.tier-a.tier);
 if(quality==='low') sorted = sorted.filter(t=>t.tier < 70);
 if(!sorted.length) sorted = [...F1_TEAMS].filter(t=>t.name!==currentTeamName());
 const offerCount = clamp(S.reputacion>=55?2:1, 1, 2);
 const pool = sorted.slice(0, offerCount).map(t=>({...t, role: deriveOfferedRole(t)}));
 return {type:'f1Offer', options:pool, isNonRenewal:true};
}
// Mal año de reserva: probá suerte en algún equipo chico dispuesto a arriesgarse, o si ni eso, tocó
// bajar a reconstruirse en F2 -- mismo camino de siempre para quedar sin asiento de F1 (checkSeatRenewal).
function buildReserveFreeAgentEvent(despido){
 const curTier = F1_TEAMS.find(t=>t.name===currentTeamName())?.tier || 60;
 const willing = F1_TEAMS.filter(t=>t.tier <= curTier-4 && t.name!==currentTeamName());
 if(willing.length>0 && S.reputacion>=15 && !despido){
   const pool = willing.sort((a,b)=>b.tier-a.tier).slice(0,1).map(t=>({...t, role: deriveOfferedRole(t)}));
   return {type:'f1Offer', options:pool, isNonRenewal:true};
 }
 S.ladderIdx = LADDER.length-1;
 S.seasonsInCategory = 0;
 S.f1Role = null;
 const ev = buildTeamOfferEvent(S.ladderIdx, false);
 ev.isDemotion = true;
 return ev;
}

// Matriz de probabilidades acordada: se agrupa el año de reserva en "bueno" (≥66% de éxito en los
// eventos), "regular" (34-65%) o "malo" (<34%), y desde ahí se sortea el desenlace. Devuelve null si el
// jugador sigue de reserva sin que pase nada (no corta el bloque de runSeasons()), o un S.pending nuevo
// si el mercado se mueve (ahí sí corta el bloque, igual que una no-renovación forzada).
function checkReserveSeasonOutcome(){
 const log = S.reserveLog || {successes:0, fails:0, total:0};
 const rate = log.total>0 ? log.successes/log.total : 0.5;
 S.reserveLog = {successes:0, fails:0, total:0};
 const roll = rnd();
 if(rate >= 0.66){ // buen rendimiento: 60% N2 / 15% N1 / 20% ofertas / 5% libre
   if(roll<0.60) return promoteToRole('segundo');
   if(roll<0.75) return promoteToRole('primero');
   if(roll<0.95) return buildReserveMarketOffers('any');
   return buildReserveFreeAgentEvent(false);
 } else if(rate >= 0.34){ // rendimiento regular: 40% sigue reserva / 30% N2 / 20% ofertas / 10% libre
   if(roll<0.40) return null;
   if(roll<0.70) return promoteToRole('segundo');
   if(roll<0.90) return buildReserveMarketOffers('any');
   return buildReserveFreeAgentEvent(false);
 } else { // mal rendimiento: 60% despido / 20% sigue reserva / 20% ofertas de equipos chicos / 0% ascenso
   if(roll<0.60) return buildReserveFreeAgentEvent(true);
   if(roll<0.80) return null;
   return buildReserveMarketOffers('low');
 }
}

// Recalcula Nº1/Nº2 de un piloto TITULAR (nunca reserva, eso lo maneja lo de arriba) al cierre de cada
// temporada, comparando OVR+reputación contra su compañero de equipo -- en la misma pasada en la que
// evolveAIDrivers() ya hizo evolucionar a ese compañero, así la comparación es siempre pareja/actual.
function updatePlayerF1Role(){
 if(!(S.ladderIdx>=LADDER.length && !S.retired)) return;
 if(S.f1Role==='reserva' || !S.f1Role) return;
 const mate = getTeamAIDrivers(currentTeamName())[0];
 if(!mate) return;
 const playerScore = S.ovr + S.reputacion*0.15;
 const mateScore = mate.ovr + mate.reputacion*0.15;
 S.f1Role = playerScore >= mateScore ? 'primero' : 'segundo';
}

// v3.8: acepta un objeto "extra" opcional que pisa cualquier campo del default (por ejemplo, el evento
// fatal la usa para forzar races/wins/podiums/points/finalPos en 0 y marcar fatal:true, ya que ahí no
// se corrió ningún bloque de temporadas — ver applyEventChoice).
function pushTimelineRow(extra){
 S.timeline.push(Object.assign({
   age:S.age,
   teamName:currentTeamName(),
   color:currentTeamColor(),
   logo:currentTeamLogo(),
   ovr:Math.round(S.ovr),
   races:lastBlockCache.races,
   wins:lastBlockCache.wins,
   podiums:lastBlockCache.podiums,
   points:lastBlockCache.points,
   finalPos:lastBlockCache.finalPos,
   role: (S.ladderIdx>=LADDER.length) ? S.f1Role : null, // v6: Nº1/Nº2/Reserva vigente en esta fila
   // v3.7.6: qué títulos se ganaron durante este bloque de temporadas (copia de _pendingTitleReveals
   // en el momento exacto en que se cierra la fila -- todavía no se vació por playPendingTitleReveals(),
   // que recién corre después de render()). Así el trofeo puede pegarse al nombre del equipo en ESTA fila,
   // el mismo año/bloque en el que se ganó, en vez de vivir sólo aparte en la vitrina.
   titles:[..._pendingTitleReveals]
 }, extra||{}));
}

// v3.7.5: dispara, uno por uno, la animación de cada título acumulado en _pendingTitleReveals durante
// el bloque de temporadas que se acaba de simular. Se llama DESPUÉS de render(), así que el DOM ya
// tiene la fila nueva del timeline y el chip actualizado de la vitrina para usar como destino de vuelo.
function playPendingTitleReveals(){
 if(!_pendingTitleReveals.length) return;
 const queue = _pendingTitleReveals;
 _pendingTitleReveals = [];
 const runNext = i => { if(i < queue.length) playSingleTitleReveal(queue[i], ()=>runNext(i+1)); };
 runNext(0);
}

// Las 3 fases de la animación de un único título (ver desglose pedido):
//  1) Revelación: copa gigante centrada, pop de escala (0 -> 1.18 -> 1) + resplandor radial dorado de fondo.
//  2) Asentamiento: la MISMA copa vuela y se achica hasta la fila "now" del timeline (junto al "Campeón").
//  3) Integración: una copia chica ("chispa") viaja de ahí hasta el chip de la vitrina y lo hace rebotar.
// Fases 2 y 3 usan FLIP manual (getBoundingClientRect antes/después + Web Animations API) para no
// depender de ninguna librería. Si algún destino no está en el DOM (p.ej. terminó la carrera y se está
// mostrando el resumen en vez de la trayectoria), esa fase se salta con gracia en vez de romper.
function playSingleTitleReveal(catId, onDone){
 const meta = TROPHY_META[catId];
 if(!meta){ onDone(); return; }

 const backdrop = document.createElement('div');
 backdrop.className = 'title-reveal-backdrop';
 backdrop.innerHTML = `<div class="title-reveal-label">
   <div class="big">${catId==='constructors' ? '¡Campeonato de Constructores!' : '¡Campeón del Mundo!'}</div>
   <div class="small">${meta.label}</div>
 </div>`;
 document.body.appendChild(backdrop);

 const trophy = document.createElement(meta.img ? 'img' : 'span');
 trophy.className = 'title-reveal-trophy';
 if(meta.img){ trophy.src = meta.img; trophy.alt = meta.label; trophy.style.height = '190px'; trophy.style.width = 'auto'; }
 else { trophy.textContent = meta.emoji; trophy.style.fontSize = '120px'; trophy.style.lineHeight = '1'; }
 document.body.appendChild(trophy);

 // --- Fase 1: pop & glow, centrada en pantalla ---
 const cx = window.innerWidth/2, cy = window.innerHeight/2;
 trophy.style.left = cx+'px'; trophy.style.top = cy+'px';
 trophy.style.transform = 'translate(-50%,-50%) scale(0.001)';
 requestAnimationFrame(()=>{
   backdrop.classList.add('show');
   trophy.animate([
     {transform:'translate(-50%,-50%) scale(0.001)'},
     {transform:'translate(-50%,-50%) scale(1.18)', offset:0.68},
     {transform:'translate(-50%,-50%) scale(1)'}
   ], {duration:620, easing:'cubic-bezier(.22,.9,.24,1.1)', fill:'forwards'});
 });

 setTimeout(()=>{
   backdrop.classList.remove('show');
   flyToTimeline();
 }, 950);

 // --- Fase 2: vuela y se achica hasta la fila nueva del timeline ---
 function flyToTimeline(){
   const target = document.querySelector('.tl-row.now .tl-pos') || document.querySelector('.tl-row.now .tl-ovr');
   if(!target){
     const fade = trophy.animate([{opacity:1},{opacity:0}], {duration:280, fill:'forwards'});
     fade.onfinish = ()=>{ trophy.remove(); backdrop.remove(); onDone(); };
     return;
   }
   const fromRect = trophy.getBoundingClientRect();
   const toRect = target.getBoundingClientRect();
   const toX = toRect.left, toY = toRect.top + toRect.height/2;
   const endH = 22; // mismo alto aprox. que .tl-ovr-pill / .trophy-icon-img, para que "encaje" en la celda
   const scaleTo = endH / fromRect.height;
   const dx = toX - (fromRect.left + fromRect.width/2);
   const dy = toY - (fromRect.top + fromRect.height/2);
   const anim = trophy.animate([
     {transform:'translate(-50%,-50%) scale(1)'},
     {transform:`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(${scaleTo})`}
   ], {duration:620, easing:'cubic-bezier(.32,.6,.18,1)', fill:'forwards'});
   anim.onfinish = ()=>{
     const row = document.querySelector('.tl-row.now');
     if(row){ row.classList.add('badge-snap'); setTimeout(()=>row.classList.remove('badge-snap'), 650); }
     trophy.remove();
     flyToVitrina(toX, toY);
   };
 }

 // --- Fase 3: una chispa viaja desde el timeline hasta el chip de la vitrina, que rebota al recibirla ---
 function flyToVitrina(fromX, fromY){
   const chip = document.querySelector(`.trophy-row [data-trophy-id="${catId}"]`);
   if(!chip){ backdrop.remove(); onDone(); return; }
   const spark = document.createElement(meta.img ? 'img' : 'span');
   spark.className = 'title-reveal-spark';
   if(meta.img){ spark.src = meta.img; spark.style.height = '22px'; spark.style.width = 'auto'; }
   else { spark.textContent = meta.emoji; spark.style.fontSize = '16px'; }
   spark.style.left = fromX+'px'; spark.style.top = fromY+'px';
   spark.style.transform = 'translate(-50%,-50%)';
   document.body.appendChild(spark);
   const chipRect = chip.getBoundingClientRect();
   const dx = (chipRect.left + chipRect.width/2) - fromX;
   const dy = (chipRect.top + chipRect.height/2) - fromY;
   const anim = spark.animate([
     {transform:'translate(-50%,-50%) scale(1)', opacity:1},
     {transform:`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(0.55)`, opacity:0.7}
   ], {duration:460, easing:'cubic-bezier(.4,.15,.2,1)', fill:'forwards'});
   anim.onfinish = ()=>{
     spark.remove();
     chip.classList.add('badge-snap'); // elastic ease-out (badgeSnap keyframe)
     setTimeout(()=>chip.classList.remove('badge-snap'), 600);
     backdrop.remove();
     onDone();
   };
 }
}

// v3.7: HUD de dos columnas -- Mundial de Pilotos (izquierda) + Campeonato de Constructores (derecha),
// cada uno con su podio (top 3) y una fila aparte con la posición del jugador/su equipo cuando queda
// afuera del podio. arrowFor() e isPlayer comparten estilo entre ambas columnas.
//
// v3.7.2: animación de cambio de posición. buildDriverNews()/buildConstructorNews() marcan cada
// standings nuevo con un _seq incremental (contadores más abajo). Guardamos acá el último _seq que
// ya animamos: mientras el jugador siga en la pantalla de carrera clickeando cosas, render() vuelve a
// llamar a standingsHUDHTML() muchas veces con el MISMO dn/cn (misma temporada), así que sólo animamos
// la primera vez que aparece un standings nuevo, no en cada re-render.
let _driverNewsSeq = 0, _constructorNewsSeq = 0;
let _lastAnimatedDriverSeq = null, _lastAnimatedConstructorSeq = null;
function standingsHUDHTML(){
 const dn = S.lastDriverNews, cn = S.lastConstructorNews;
 if(!dn && !cn) return '';
 const medals = ['🥇','🥈','🥉'];
 const arrowFor = d => d>0 ? {sym:`▲${d}`, cls:'up'} : d<0 ? {sym:`▼${Math.abs(d)}`, cls:'down'} : {sym:'=', cls:'same'};
 const posLabel = pos => pos<=3 ? medals[pos-1] : `${pos}º`;
 // Sólo animamos filas del PODIO (pos 1-3): si la posición previa (pos+delta) también caía dentro del
 // podio, es un intercambio interno -> desliza hacia arriba/abajo. Si la posición previa estaba fuera
 // del podio (o no hay delta por debut), es una entrada nueva -> fade-in. Sin delta, sin animación.
 const podiumAnimClass = (pos, delta, animate) => {
   if(!animate || !delta) return '';
   const prevPos = pos + delta;
   if(prevPos>=1 && prevPos<=3) return delta>0 ? ' row-shift-up' : ' row-shift-down';
   return ' row-fade-in';
 };
 const driverAnimate = dn && dn._seq !== _lastAnimatedDriverSeq;
 const constructorAnimate = cn && cn._seq !== _lastAnimatedConstructorSeq;
 const driverRowHTML = e => {
   const a = arrowFor(e.delta);
   const animCls = e.pos<=3 ? podiumAnimClass(e.pos, e.delta, driverAnimate) : (driverAnimate ? ' row-fade-in' : '');
   return `<div class="standings-row${e.isPlayer?' me':''}${animCls}">
     <span class="pos">${posLabel(e.pos)}</span>
     ${flagIcon(e.nat||'xx')}
     <span class="nm">${e.name}${e.isPlayer?' <span class="me-tag">TÚ</span>':''}</span>
     <span class="delta-badge ${a.cls}">${a.sym}</span>
     ${teamBadge(e.team, e.teamColor, e.teamLogo, 'tl-logo')}
   </div>`;
 };
 const teamRowHTML = t => {
   const a = arrowFor(t.delta);
   const animCls = t.pos<=3 ? podiumAnimClass(t.pos, t.delta, constructorAnimate) : (constructorAnimate ? ' row-fade-in' : '');
   return `<div class="standings-row${animCls}">
     <span class="pos">${posLabel(t.pos)}</span>
     ${teamBadge(t.name, t.color, t.logo, 'tl-logo')}
     <span class="nm">${t.name}</span>
     <span class="delta-badge ${a.cls}">${a.sym}</span>
   </div>`;
 };
 const html = `<div class="standings-hud">
   ${dn ? `<div class="standings-col">
     <div class="standings-head">🏆 Mundial de Pilotos</div>
     <div class="standings-rows">
       ${dn.top3.map(driverRowHTML).join('')}
       ${dn.playerRow ? driverRowHTML(dn.playerRow) : ''}
     </div>
   </div>` : ''}
   ${cn ? `<div class="standings-col standings-col-right">
     <div class="standings-head">🏭 Campeonato de Constructores</div>
     <div class="standings-rows">
       ${cn.podium.map(teamRowHTML).join('')}
       ${cn.playerTeamRow ? teamRowHTML(cn.playerTeamRow) : ''}
     </div>
     ${cn.headlines.length ? `<div class="news-headlines">${cn.headlines.map(h=>`<div>${h}</div>`).join('')}</div>` : ''}
   </div>` : ''}
 </div>`;
 // Marcamos como "ya animado" DESPUÉS de generar el HTML de este render.
 if(dn) _lastAnimatedDriverSeq = dn._seq;
 if(cn) _lastAnimatedConstructorSeq = cn._seq;
 return html;
}

 }
 if(p.type==='event'){
   const ev = p.ev;
   return `<div class="decision-card">

     <p class="desc">${ev.desc}</p>
     <div class="opt-grid">

// v6.1: recap visual de la última temporada de piloto reserva (test days + sustitución si hubo), con
// el formato de referencia: icono + "Evento: OK/Revisar" + "Resultado: Excelente/Mejorable" en dos líneas.
function reserveRecapHTML(){
 const r = S.lastReserveRecap;
 if(!r || !r.tests || !r.tests.length) return '';
 const rowHTML = t => `<div class="reserve-outcome ${t.success?'up':'down'}">
   <span class="ro-icon">${t.icon}</span>
   <div>
     <div class="ro-line1">${t.label}: ${t.success?'OK':'Revisar'}</div>
     <div class="ro-line2">Resultado: ${t.success?'Excelente':'Mejorable'}</div>
   </div>
 </div>`;
 return `<div class="reserve-recap">${r.tests.map(rowHTML).join('')}${r.substitution?rowHTML(r.substitution):''}</div>`;
}

// v4: arma los chips/filas de una opción de evento. Simplificado a propósito: un evento SOLO toca
// OVR, REP y/o Valor, nunca los tres juntos en la misma opción (como mucho dos). Hay dos formatos:
//  - Apuesta con % (up + upv/dnv): fila ancha con ícono, valor y chance — el mismo lenguaje visual
//    en todos lados (antes esto se rompía si faltaba upv o dnv; ahora ambos son obligatorios juntos).
//  - Cambio garantizado (ovrDelta/repDelta/valueMult): pill chico, como antes.
function eventOptionChipsHTML(opt){
 if(opt.neutral) return '<span class="chip chip-neutral">Sin cambios</span>';
 const chips = [];
 // Apuesta de OVR con % de éxito — único lugar del juego donde se juega con probabilidad.
 if(opt.up!=null && opt.upv!=null && opt.dnv!=null){
   chips.push(`<div class="outcome-row up"><span class="oc-left"><span class="oc-icon">📈</span>+${opt.upv} OVR</span><span class="oc-pct">${opt.up}%</span></div>`);
   chips.push(`<div class="outcome-row down"><span class="oc-left"><span class="oc-icon">📉</span>${opt.dnv} OVR</span><span class="oc-pct">${100-opt.up}%</span></div>`);
 }
 // Cambio de OVR garantizado.
 if(opt.ovrDelta!=null){
   chips.push(`<span class="chip ${opt.ovrDelta>=0?'chip-up':'chip-down'}">${opt.ovrDelta>=0?'+':''}${opt.ovrDelta} OVR</span>`);
 }
 // Cambio de reputación garantizado ("REP", corto).
 if(opt.repDelta!=null){
   chips.push(`<span class="chip ${opt.repDelta>=0?'chip-up':'chip-down'}">${opt.repDelta>=0?'+':''}${opt.repDelta} REP</span>`);
 }
 // Cambio de valor de mercado, siempre como % ("Valor", corto).
 if(opt.valueMult!=null){
   const pct = Math.round((opt.valueMult-1)*100);
   chips.push(`<span class="chip ${pct>=0?'chip-up':'chip-down'}">${pct>=0?'+':''}${pct}% Valor</span>`);
 }
 if(opt.fatalChance){
   chips.push(`<span class="chip chip-down">⚠ riesgo de accidente grave</span>`);
 }
 return chips.length ? chips.join('') : '<span class="chip chip-neutral">Sin cambios</span>';
}

// v5: trofeos de la vitrina AHORA viven pegados a la escudería en la que se ganaron, agrupados por
// categoría (nunca mezclados). Por defecto se ven apilados/superpuestos; al pasar el mouse por encima
// (sin hacer click) se separan un poco y revelan la etiqueta con la cantidad y el nombre del título.
// Si hay uno solo, no hay nada que separar: el hover solo muestra el nombre, sin "1x".
function teamTrophyStacksHTML(st){
 const byCat = st.titlesByCat;
 if(!byCat) return '';
 const stacks = TROPHY_ORDER.filter(id=>byCat[id]>0).map(id=>{
   const meta = TROPHY_META[id];
   const n = byCat[id];
   const icons = Array.from({length:n}).map((_,i)=>
     `<img src="${meta.img}" class="trophy-stack-icon" style="--i:${i};" alt="${meta.label}">`
   ).join('');
   const label = n>1 ? `${n}x ${meta.label}` : meta.label;
   return `<div class="trophy-stack" style="--n:${n};">
     <div class="trophy-stack-icons">${icons}</div>
     <div class="trophy-stack-label">${label}</div>
   </div>`;
 }).join('');
 return stacks ? `<div class="trophy-stacks">${stacks}</div>` : '';
}

// v5: reemplaza la lectura larga del arquetipo (que muchas veces no tenía nada que ver con cómo fue
// la carrera realmente) por un apodo corto basado en resultados reales, no en probabilidades ocultas.
// Villano: multicampeón de pilotos (3+). Tipazo: motor del equipo, campeón de constructores (3+).
// Lamentable: colgó los guantes antes de tiempo sin ganar nada. Boludo: cerró la carrera (llegando
// al retiro por edad) sin ningún título en la vitrina.
function legacyTag(){
 const f1Titles = S.titles.f1 || 0;
 const conTitles = S.titles.constructors || 0;
 const totalTitles = Object.values(S.titles).reduce((a,b)=>a+b, 0);
 const earlyExit = !!S.careerEndReason && S.careerEndReason !== 'age';
 if(f1Titles >= 3) return {id:'villano', label:'VILLANO'};
 if(conTitles >= 3) return {id:'tipazo', label:'TIPAZO'};
 if(totalTitles === 0 && earlyExit) return {id:'lamentable', label:'LAMENTABLE'};
 if(totalTitles === 0) return {id:'boludo', label:'BOLUDO'};
 return null;
}
function legacyTagHTML(){
 const tag = legacyTag();
 if(!tag) return '';
 return `<div style="text-align:center;"><div class="legacy-tag legacy-${tag.id}">${tag.label}</div></div>`;
}

// v: "Historia" -- podio histórico de campeones de Mundial de Pilotos, comparado contra el usuario.
// BASE_CHAMPIONS es el palmarés real fijo, punto de partida de toda partida. aiKey vincula una entrada
// de la base con el nombre EXACTO de ese mismo piloto si existe como piloto IA en este juego (F1_DRIVERS_SEED):
// si ese piloto IA ganó títulos durante la partida (S.aiDrivers[name].f1Titles, ver runSeasons), esos
// títulos se SUMAN al total real de la base -- así "M. Verstappen" puede aparecer con más de 4 si ganó
// de nuevo en esta partida. Pilotos IA que ganaron títulos y no están en la base (ej. Leclerc, Colapinto)
// se suman como entradas nuevas, compitiendo con todo lo demás solo por lo ganado EN esta partida.
const BASE_CHAMPIONS = [
 {name:'M. Schumacher', nat:'de', titles:7, aiKey:null},
 {name:'L. Hamilton',   nat:'gb', titles:7, aiKey:'L. Hamilton'},
 {name:'J.M. Fangio',   nat:'ar', titles:5, aiKey:null},
 {name:'M. Verstappen', nat:'nl', titles:4, aiKey:'M. Verstappen'},
 {name:'A. Prost',      nat:'fr', titles:4, aiKey:null},
];
function buildChampionsHistory(){
 const baseKeys = new Set(BASE_CHAMPIONS.map(c=>c.aiKey).filter(Boolean));
 const list = BASE_CHAMPIONS.map(c=>{
   const bonus = (c.aiKey && S.aiDrivers && S.aiDrivers[c.aiKey]) ? (S.aiDrivers[c.aiKey].f1Titles||0) : 0;
   return {name:c.name, nat:c.nat, titles:c.titles+bonus, isPlayer:false};
 });
 // pilotos IA que escribieron su propia historia esta partida (y no son ya uno de los de la base)
 if(S.aiDrivers){
   Object.values(S.aiDrivers).forEach(d=>{
     if((d.f1Titles||0) > 0 && !baseKeys.has(d.name)){
       list.push({name:d.name, nat:d.nat, titles:d.f1Titles, isPlayer:false});
     }
   });
 }
 // el usuario, solo si ganó al menos un título de pilotos (si no, la lista sigue siendo la de siempre)
 const playerTitles = S.titles.f1||0;
 if(playerTitles > 0){
   const playerNat = (COUNTRIES.find(c=>c[1]===S.country)||[null])[0];
   list.push({name:S.surname||'Vos', nat:playerNat, titles:playerTitles, isPlayer:true});
 }
 // más títulos primero; Array.sort es estable, así que entre empates se respeta el orden de carga de
 // arriba (la base mantiene su orden real de prestigio, ej. Schumacher antes que Hamilton en el 7).
 list.sort((a,b)=>b.titles-a.titles);
 return list;
}
// Arma las filas del podio histórico, con el usuario siempre visible: si entra en el Top 5 se muestra
// ahí mismo; si no, se corta en 5 y se agrega su fila real más abajo con un separador, para que siempre
// pueda ver dónde quedó parado en la comparación (esa es la idea central de la pantalla).
function championsHistoryRowsHTML(){
 const list = buildChampionsHistory();
 const top = list.slice(0,5);
 const playerIdx = list.findIndex(e=>e.isPlayer);
 const playerInTop = playerIdx>=0 && playerIdx<5;
 const rowHTML = (e,rank) => `<div class="standings-row champ-row${e.isPlayer?' me':''}">
   <span class="pos">${rank}º</span>
   ${flagIcon(e.nat||'xx')}
   <span class="nm">${e.name}${e.isPlayer?' <span class="me-tag">TÚ</span>':''}</span>
   <span class="champ-count">🏆×${e.titles}</span>
 </div>`;
 let html = top.map((e,i)=>rowHTML(e,i+1)).join('');
 if(playerIdx>=5){
   html += `<div class="champ-sep">⋯</div>` + rowHTML(list[playerIdx], playerIdx+1);
 }
 return html;
}
function championsHistoryOverlayHTML(){
 return `<div class="champs-backdrop">
   <div class="champs-modal fadein">
     <button class="champs-close" onclick="S.showChampionsHistory=false; render()" aria-label="Cerrar">✕</button>
     <div class="champs-head">🏆 Campeones históricos</div>
     <p class="champs-sub">Así queda el palmarés de Mundiales de Pilotos después de esta partida.</p>
     <div class="standings-rows">${championsHistoryRowsHTML()}</div>
   </div>
 </div>`;
}

}
