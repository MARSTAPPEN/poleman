<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poleman — Construí tu carrera automovilística</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700;900&family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07080a;
  --panel:#111318;
  --panel2:#181b21;
  --panel3:#1f232b;
  --line:#2a2e37;
  --red:#E10600;
  --red-dim:#5c0a08;
  --orange:#FF8C1A;
  --gold:#F5C518;
  --silver:#C7CCD1;
  --bronze:#CD7F32;
  --text:#F5F6F7;
  --muted:#9AA0A8;
  --muted2:#6b7078;
  --green:#33D17A;
  --blue:#3671C6;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  background:
    radial-gradient(ellipse 900px 500px at 15% -10%, rgba(225,6,0,0.10), transparent 60%),
    radial-gradient(ellipse 700px 500px at 110% 10%, rgba(54,113,198,0.10), transparent 60%),
    var(--bg);
  color:var(--text);
  font-family:'Inter',sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:'Space Mono',monospace;}
.display{font-family:'Titillium Web',sans-serif; font-weight:900; letter-spacing:-0.01em;}
button{font-family:inherit; cursor:pointer;}
::selection{background:var(--red); color:#fff;}
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:#2a2e37; border-radius:4px;}
::-webkit-scrollbar-track{background:transparent;}

.app{max-width:1180px; margin:0 auto; padding:28px 20px 60px;}

/* ---------- top bar ---------- */
.topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:28px;}
.eyebrow{font-size:12px; letter-spacing:0.16em; color:var(--muted); font-weight:700; text-transform:uppercase; display:flex; align-items:center; gap:10px;}
.eyebrow.brand{font-family:'Titillium Web'; font-size:15px; font-weight:900; letter-spacing:0.24em; color:var(--text);}
.eyebrow.brand::before{content:''; width:8px; height:8px; border-radius:50%; background:var(--red); box-shadow:0 0 10px var(--red); display:inline-block;}
.eyebrow .dot{width:7px; height:7px; border-radius:50%; background:var(--red); box-shadow:0 0 10px var(--red);}
.lights{display:flex; gap:6px;}
.lights i{width:9px; height:9px; border-radius:50%; background:#2a2e37; display:block; box-shadow:inset 0 0 0 1px #35393f;}
.lights i.on{background:var(--red); box-shadow:0 0 8px var(--red), inset 0 0 0 1px #ff6a5c;}

/* ---------- buttons ---------- */
.btn{
  border:1px solid transparent; border-radius:999px; padding:13px 26px; font-weight:700; font-size:14.5px;
  transition:transform .12s ease, background .15s ease, border-color .15s ease; white-space:nowrap;
}
.btn:active{transform:scale(0.97);}
.btn-primary{background:var(--text); color:#0a0a0c;}
.btn-primary:hover{background:#dcdde0;}
.btn-outline{background:transparent; color:var(--text); border-color:#3a3f48;}
.btn-outline:hover{border-color:#5a606b;}
.btn-red{background:var(--red); color:#fff;}
.btn-red:hover{background:#ff251d;}
.btn:disabled{opacity:0.35; cursor:not-allowed;}
.btn:disabled:hover{transform:none;}

.pill{border-radius:999px; padding:11px 20px; font-weight:700; font-size:13.5px; border:1px solid #2c313a; background:#14161b; color:var(--muted); transition:all .15s ease;}
.pill.active{background:var(--text); color:#0a0a0c; border-color:var(--text);}
.pill:hover:not(.active){border-color:#4a505b;}
.pill-locked{color:var(--muted2); opacity:.55; cursor:not-allowed;}
.pill-locked:hover{border-color:#2c313a;}

/* =====================================================
   HOME SCREEN
===================================================== */
.home-hero{
  display:grid; grid-template-columns:1.05fr 1fr; gap:48px; align-items:center; min-height:70vh;
}
@media(max-width:860px){.home-hero{grid-template-columns:1fr; min-height:auto;}}
.track-card{
  position:relative; aspect-ratio:1/1; border-radius:28px; overflow:hidden;
  background: linear-gradient(160deg, #16181d, #0b0c0f 65%);
  border:1px solid var(--line);
  display:flex; align-items:center; justify-content:center;
}
.track-card svg{width:88%; height:88%;}
.track-glow{position:absolute; inset:0; background:radial-gradient(circle at 30% 20%, rgba(225,6,0,0.18), transparent 55%);}
.home-copy h1{font-size:44px; line-height:1.04; margin:14px 0 16px;}
.home-copy p.sub{color:var(--muted); font-size:15.5px; line-height:1.6; max-width:460px; margin-bottom:26px;}
.diff-row{display:flex; gap:10px; margin-bottom:8px; flex-wrap:wrap;}
.diff-hint-wrap{position:relative; overflow:hidden; min-height:18px; margin-bottom:26px;}
.diff-hint{font-size:12.5px; color:var(--orange); position:relative; z-index:1;}
.wipe-bar{position:absolute; top:-6px; left:-40%; width:34%; height:calc(100% + 12px); background:linear-gradient(100deg, transparent 0%, rgba(225,6,0,0) 30%, var(--red) 48%, var(--red) 56%, rgba(225,6,0,0) 74%, transparent 100%); transform:skewX(-24deg); opacity:0; pointer-events:none; z-index:2;}
.wipe-bar.play{animation:wipeMove .46s cubic-bezier(.65,0,.35,1) forwards;}
@keyframes wipeMove{0%{left:-40%; opacity:0;} 12%{opacity:0.95;} 50%{left:40%; opacity:0.95;} 88%{opacity:0.95;} 100%{left:130%; opacity:0;}}

.team-slash{position:fixed; top:0; left:-60vw; width:55vw; height:100vh; pointer-events:none; z-index:9999; opacity:0; transform:skewX(-14deg);
 background:linear-gradient(100deg, transparent 0%, transparent 32%, var(--slash-color, #E10600) 47%, var(--slash-color, #E10600) 57%, transparent 72%, transparent 100%);}
.team-slash.play{animation:teamSlashMove .55s cubic-bezier(.65,0,.35,1) forwards;}
@keyframes teamSlashMove{0%{left:-60vw; opacity:0;} 12%{opacity:0.92;} 46%{left:40vw; opacity:0.96;} 88%{opacity:0.85;} 100%{left:135vw; opacity:0;}}
.home-actions{display:flex; gap:12px; flex-wrap:wrap;}

/* =====================================================
   IDENTITY SCREEN
===================================================== */
.card-panel{background:var(--panel); border:1px solid var(--line); border-radius:22px; padding:28px;}
.identity-grid{display:grid; grid-template-columns:300px 1fr; gap:0; }
.identity-grid > div{padding:0 30px;}
.identity-grid > div:not(:first-child){border-left:1px solid var(--line);}
@media(max-width:820px){.identity-grid{grid-template-columns:1fr;} .identity-grid > div{border-left:none !important; border-top:1px solid var(--line); padding:22px 4px !important;} .identity-grid > div:first-child{padding-top:0 !important; border-top:none !important;}}
.section-label{font-size:12px; letter-spacing:0.14em; text-transform:uppercase; color:var(--muted2); font-weight:700; margin-bottom:16px; text-align:center;}

.helmet-wrap{display:flex; flex-direction:column; align-items:center;}
.helmet{width:190px; height:190px; position:relative; margin-bottom:18px;}
.helmet svg{width:100%; height:100%; display:block; filter:drop-shadow(0 8px 16px rgba(0,0,0,0.35));}
.helmet-number{position:absolute; top:41%; left:50%; transform:translate(-50%,-50%); font-family:'Titillium Web'; font-weight:900; font-size:27px; color:#0a0a0c; line-height:1;}
.field{width:100%; margin-bottom:12px;}
.field label{display:block; font-size:11px; color:var(--muted2); text-transform:uppercase; letter-spacing:0.1em; margin-bottom:6px; font-weight:700;}
.field input{width:100%; background:var(--panel2); border:1px solid var(--line); color:var(--text); border-radius:10px; padding:11px 12px; font-size:14px; font-weight:600; text-align:center;}
.field input:focus{outline:none; border-color:var(--red);}
.field-row{display:flex; gap:10px;}

.search-box{position:relative; margin-bottom:14px;}
.search-box input{width:100%; background:var(--panel2); border:1px solid var(--line); color:var(--text); border-radius:10px; padding:11px 14px; font-size:14px;}
.search-box input:focus{outline:none; border-color:var(--red);}
.country-list{max-height:290px; overflow-y:auto; display:flex; flex-direction:column; gap:3px;}
.country-item{display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:9px; font-size:13.5px; font-weight:500; cursor:pointer; border:1px solid transparent;}
.country-item:hover{background:var(--panel2);}
.country-item.sel{background:rgba(225,6,0,0.14); border-color:var(--red);}
.country-item .flag-icon{width:22px; height:16px; flex-shrink:0;}
.flag-icon{display:inline-flex; width:20px; height:15px; border-radius:2px; overflow:hidden; box-shadow:0 0 0 1px rgba(255,255,255,0.12); flex-shrink:0; vertical-align:middle; margin-right:2px;}
.flag-icon svg{width:100%; height:100%; display:block; object-fit:cover;}
.flag-icon-empty{background:#2a2e37;}
.tag .flag-icon{margin-right:5px;}

.identity-footer{display:flex; justify-content:space-between; align-items:center; margin-top:26px;}

/* =====================================================
   CAREER SCREEN
===================================================== */
.career-grid{display:grid; grid-template-columns:1fr 1.15fr; gap:22px; align-items:start;}
@media(max-width:900px){.career-grid{grid-template-columns:1fr;}}
/* v4: en mobile, la pantalla principal de carrera se reordena a
   ficha -> trayectoria -> fichajes/eventos -> podio de campeones (este último al final, requiere
   scroll). Solo afecta .career-grid-main (la pantalla de juego), no el layout de escritorio ni las
   pantallas de retiro/resumen, que no llevan esa clase y siguen igual que antes.
   display:contents "abre" los dos divs contenedores sin clase para que sus hijos pasen a ser ítems
   directos del grid y así puedan reordenarse libremente con order, sin cambiar ni un estilo visual. */
@media(max-width:900px){
  .career-grid-main > div:not([class]){display:contents;}
  .career-grid-main .player-card{order:1;}
  .career-grid-main .timeline-panel{order:2;}
  .career-grid-main .decision-card{order:3;}
  .career-grid-main .standings-hud{order:4;}
}

.player-card{background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:22px; margin-bottom:18px;}
.player-top{display:flex; gap:16px; align-items:center;}
@media(max-width:480px){
  .player-top{flex-wrap:wrap; gap:10px;}
  .ovr-badge{width:52px; height:52px;}
  .ovr-badge .n{font-size:19px;}
}
.ovr-badge{
  width:64px; height:64px; border-radius:14px; display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:var(--orange); color:#1a1200; flex-shrink:0;
}
.ovr-badge .n{font-family:'Titillium Web'; font-weight:900; font-size:24px; line-height:1;}
.ovr-badge .l{font-size:8.5px; font-weight:800; letter-spacing:0.06em;}
.ovr-badge.tier-s{background:linear-gradient(135deg,#F5C518,#ffe27a); color:#2b2200;}
.ovr-badge.tier-a{background:var(--orange);}
.ovr-badge.tier-b{background:#4a90d9; color:#04101c;}
.ovr-badge.tier-c{background:#7a808a; color:#0a0a0c;}

.rep-stars{color:var(--gold); font-size:14px; letter-spacing:1px;}

.season-delta{font-size:11.5px; color:var(--muted2); margin-top:12px; font-weight:600;}
.season-delta b{color:var(--muted2); font-weight:800;}
.season-delta b.up{color:#3ddc84;}
.season-delta b.down{color:#ff5b5b;}

.player-meta .tags{display:flex; align-items:center; gap:8px; margin-bottom:4px;}
.tag{font-size:11px; font-weight:800; padding:3px 9px; border-radius:999px; background:var(--panel2); border:1px solid var(--line); display:flex; align-items:center; gap:5px;}
.player-meta .name{font-family:'Titillium Web'; font-weight:900; font-size:19px;}

.player-side{margin-left:auto; text-align:right;}
.player-side .info-line{font-size:12px; color:var(--muted2); text-transform:uppercase; letter-spacing:0.08em; font-weight:700; margin-top:4px;}
.player-side .info-line:first-child{margin-top:0;}
.player-side .info-line b{color:var(--text); font-size:15px; margin-left:4px; text-transform:none; letter-spacing:0;}
.player-side .info-line.value-row b{font-family:'Titillium Web'; font-size:17px;}

.stat-row{display:flex; margin-top:20px; padding-top:18px; border-top:1px solid var(--line);}
.stat{flex:1; text-align:center;}
.stat .v{font-family:'Titillium Web'; font-weight:900; font-size:20px;}
.stat .k{font-size:10.5px; color:var(--muted2); text-transform:uppercase; letter-spacing:0.08em; font-weight:700; margin-top:2px;}

.trophy-row{display:flex; gap:10px; margin-top:16px; padding-top:16px; border-top:1px solid var(--line); flex-wrap:wrap; min-height:20px;}
.trophy-empty{font-size:12px; color:var(--muted2); font-style:italic;}
.trophy-chip{font-size:18px; display:flex; align-items:center; gap:4px; background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:4px 8px;}
.trophy-chip .c{font-size:11px; font-family:'Space Mono'; color:var(--muted); font-weight:700;}
.trophy-icon-emoji{line-height:1;}
.trophy-icon-img{height:28px; width:auto; max-width:26px; object-fit:contain; display:block;} /* las copas reales son altas y angostas (~1:2.3): fijamos altura y dejamos ancho automático en vez de forzar una caja cuadrada como la del emoji, o se verían aplastadas */
/* v3.7.5: animación de consecución de título -- 3 fases (ver playSingleTitleReveal()):
   1) modal centrado con pop de escala + resplandor radial dorado (.title-reveal-backdrop)
   2) la copa del modal vuela y se achica hasta la fila del timeline recién agregada
   3) una "chispa" viaja de ahí hasta el chip de la vitrina, que rebota (badge-snap) al recibirla.
   Las fases 2 y 3 mueven el propio elemento con la Web Animations API (FLIP manual calculado en JS),
   así que acá solo hace falta CSS para el modal y para el rebote final. */
.title-reveal-backdrop{
  position:fixed; inset:0; z-index:900; display:flex; align-items:center; justify-content:center;
  background:radial-gradient(circle at 50% 50%, rgba(245,197,24,0.24), rgba(0,0,0,0.74) 60%);
  opacity:0; pointer-events:none; transition:opacity .3s ease;
}
.title-reveal-backdrop.show{opacity:1;}
.title-reveal-label{
  position:absolute; top:calc(50% + 130px); left:50%; transform:translateX(-50%); width:max-content; max-width:80vw;
  text-align:center; opacity:0; transition:opacity .35s ease .2s;
}
.title-reveal-backdrop.show .title-reveal-label{opacity:1;}
.title-reveal-label .big{font-family:'Titillium Web'; font-weight:900; font-size:22px; color:#fff; letter-spacing:0.01em;}
.title-reveal-label .small{font-family:'Titillium Web'; font-size:12px; font-weight:700; color:var(--muted2); margin-top:4px; text-transform:uppercase; letter-spacing:0.08em;}
.title-reveal-trophy, .title-reveal-spark{position:fixed; top:0; left:0; z-index:901; pointer-events:none; will-change:transform;}
.title-reveal-trophy{filter:drop-shadow(0 0 28px rgba(245,197,24,0.55));}
@keyframes badgeSnap{0%{transform:scale(1);} 40%{transform:scale(1.4);} 65%{transform:scale(0.88);} 100%{transform:scale(1);}}
.trophy-chip.badge-snap{animation:badgeSnap .55s cubic-bezier(.34,1.56,.64,1);}
@keyframes rowFlash{0%{background:rgba(245,197,24,0.38);} 100%{background:rgba(245,197,24,0);}}
.tl-row.badge-snap{animation:rowFlash .65s ease;}

/* standings HUD: two-column strip -- Mundial de Pilotos (left) + Campeonato de Constructores (right) */
.standings-hud{background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:14px; display:grid; grid-template-columns:1fr 1fr; gap:18px;}
.standings-col-right{border-left:1px solid var(--line); padding-left:18px;}
.standings-head{font-size:9.5px; letter-spacing:0.08em; text-transform:uppercase; color:var(--muted2); font-weight:800; display:flex; align-items:center; gap:5px; margin-bottom:8px;}
.standings-rows{display:flex; flex-direction:column; gap:7px;}
.standings-row{display:flex; align-items:center; gap:7px; font-size:12px;}
.standings-row .pos{font-family:'Space Mono'; font-size:11px; font-weight:800; color:var(--muted2); width:16px; flex-shrink:0; text-align:center;}
.standings-row .flag-icon{margin-right:0;}
.standings-row .nm{font-weight:700; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.standings-row .me-tag{color:var(--orange); font-weight:800; font-size:10.5px; margin-left:4px;}
.standings-row.me .nm{color:var(--orange);}
.standings-row .delta-badge{font-family:'Space Mono'; font-size:10px; font-weight:800; padding:2px 6px; border-radius:999px; flex-shrink:0;}
.standings-row .delta-badge.up{background:rgba(51,209,122,0.14); color:var(--green);}
.standings-row .delta-badge.down{background:rgba(225,6,0,0.14); color:#ff6a5c;}
.standings-row .delta-badge.same{background:var(--panel3); color:var(--muted2);}
/* v3.7.2: animaciones de cambio de posición en el podio (top 3) -- se disparan solo la primera vez
   que se pinta un standings nuevo (ver _seq/gating en standingsHUDHTML), no en cada re-render. */
.standings-row.row-shift-up{animation:rowShiftUp .55s cubic-bezier(.2,.8,.3,1);}
.standings-row.row-shift-down{animation:rowShiftDown .55s cubic-bezier(.2,.8,.3,1);}
.standings-row.row-fade-in{animation:rowFadeIn .5s ease;}
@keyframes rowShiftUp{0%{transform:translateY(16px); opacity:0.25;} 100%{transform:translateY(0); opacity:1;}}
@keyframes rowShiftDown{0%{transform:translateY(-16px); opacity:0.25;} 100%{transform:translateY(0); opacity:1;}}
@keyframes rowFadeIn{0%{opacity:0; transform:scale(0.97);} 100%{opacity:1; transform:scale(1);}}
@media(max-width:480px){
  .standings-hud{grid-template-columns:1fr; gap:14px;}
  .standings-col-right{border-left:none; padding-left:0; padding-top:14px; border-top:1px solid var(--line);}
}

/* ---------- "Historia": podio histórico de campeones (notificación + pestaña en el resumen final) ---------- */
.champs-tab{
  background:var(--panel2); border:1px solid var(--line); color:var(--text); font-weight:700; font-size:13px;
  padding:9px 18px; border-radius:999px; transition:background .15s ease, border-color .15s ease;
}
.champs-tab:hover{background:var(--panel3); border-color:var(--gold);}
.champs-backdrop{
  position:fixed; inset:0; z-index:920; display:flex; align-items:center; justify-content:center;
  background:rgba(4,5,7,0.72); padding:20px;
}
.champs-modal{
  position:relative; width:100%; max-width:420px; max-height:82vh; overflow-y:auto;
  background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:24px 22px 20px;
  box-shadow:0 20px 60px rgba(0,0,0,0.5);
}
.champs-close{
  position:absolute; top:14px; right:14px; width:30px; height:30px; border-radius:50%;
  background:var(--panel2); border:1px solid var(--line); color:var(--muted); font-size:14px; line-height:1;
  display:flex; align-items:center; justify-content:center;
}
.champs-close:hover{background:var(--panel3); color:var(--text);}
.champs-head{font-family:'Titillium Web'; font-weight:900; font-size:19px; padding-right:30px;}
.champs-sub{font-size:12.5px; color:var(--muted); margin-top:4px; margin-bottom:16px; line-height:1.4;}
.champ-row{padding:8px 4px; border-radius:8px;}
.champ-row.me{background:rgba(245,197,24,0.10);}
.champ-count{font-family:'Space Mono'; font-size:12px; font-weight:700; color:var(--gold); flex-shrink:0;}
.champ-sep{text-align:center; color:var(--muted2); font-size:13px; padding:2px 0; letter-spacing:0.2em;}

/* ---------- botón de retiro voluntario "libre" -- chico, discreto, rojo, siempre disponible ---------- */
.retire-tiny-wrap{text-align:center; margin-top:16px;}
.btn-retire-tiny{
  background:transparent; border:1px solid var(--red-dim); color:#ff6a5c; font-size:11px; font-weight:700;
  padding:5px 16px; border-radius:999px; letter-spacing:0.02em;
  transition:background .15s ease, color .15s ease, border-color .15s ease;
}
.btn-retire-tiny:hover{background:rgba(225,6,0,0.14); border-color:var(--red); color:#fff;}

/* solo para eventos excepcionales (nueva escudería, desaparición, cambio de nombre, compra, etc.) */
.news-headlines{display:flex; flex-direction:column; gap:6px; margin-top:8px; padding-top:8px; border-top:1px solid var(--line); flex-basis:100%;}
.news-headlines div{font-size:12px; color:var(--muted); line-height:1.4;}

/* decision card */
.decision-card{background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:24px;}
.decision-card h3{font-family:'Titillium Web'; font-weight:900; font-size:18px; margin-bottom:6px;}
.decision-card p.desc{color:var(--muted); font-size:13.5px; line-height:1.55; margin-bottom:18px;}
.opt-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
@media(max-width:520px){.opt-grid{grid-template-columns:1fr;}}
.opt-card{background:var(--panel2); border:1px solid var(--line); border-radius:14px; padding:16px; text-align:center; transition:all .15s ease; cursor:pointer;}
.opt-card:hover{border-color:#5a606b; transform:translateY(-2px);}
.opt-card .icon{font-size:26px; margin-bottom:8px;}
.opt-card .lbl{font-weight:800; font-size:14px; margin-bottom:10px;}
.opt-card .chip{display:inline-flex; gap:6px; align-items:center; font-size:11.5px; font-weight:700; padding:3px 8px; border-radius:999px; margin:2px;}
.chip-up{background:rgba(51,209,122,0.14); color:var(--green);}
.chip-down{background:rgba(225,6,0,0.14); color:#ff6a5c;}
.chip-neutral{background:var(--panel3); color:var(--muted);}
/* v4: filas con % de probabilidad (apuestas de OVR) — reemplaza el pill chico para este caso puntual,
   mismo lenguaje visual que el resto pero con más aire para leer valor + chance de un vistazo. */
.opt-card .outcome-row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 13px; border-radius:12px; margin:6px 0 0; font-weight:800; font-size:13.5px; transition:opacity .32s ease, transform .32s cubic-bezier(.34,1.56,.64,1), box-shadow .32s ease, filter .32s ease;}
.opt-card .outcome-row .oc-left{display:flex; align-items:center; gap:7px;}
.opt-card .outcome-row .oc-icon{font-size:14px; line-height:1; transition:transform .32s ease;}
.opt-card .outcome-row .oc-pct{font-weight:700; font-size:12.5px; opacity:0.72; transition:opacity .32s ease;}
.outcome-row.up{background:rgba(51,209,122,0.12); color:var(--green);}
.outcome-row.down{background:rgba(225,6,0,0.12); color:#ff6a5c;}

/* v4: animación de "sorteo" al elegir una opción con apuesta de % ------------------------- */
.opt-card{transition:transform .12s ease, opacity .3s ease, border-color .15s ease;}
.opt-card.pressed{transform:scale(0.96);}
.opt-card.dim{opacity:0.38; transform:scale(0.98);}
.opt-card.rolling .lbl{opacity:0.8;}
.opt-card.rolling .outcome-row:not(.winner):not(.loser){opacity:0.5;}
.outcome-row.winner{transform:scale(1.07); box-shadow:0 0 0 1px currentColor, 0 8px 20px -6px currentColor; z-index:1; position:relative;}
.outcome-row.winner .oc-icon{transform:scale(1.25);}
.outcome-row.winner .oc-pct{opacity:1;}
.outcome-row.loser{opacity:0.32; transform:scale(0.93); filter:grayscale(0.4); box-shadow:none;}

/* team offer cards */
.team-offer-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
@media(max-width:700px){.team-offer-grid{grid-template-columns:1fr;}}
.team-offer{background:var(--panel2); border:1px solid var(--line); border-radius:16px; padding:18px; text-align:center; transition:all .15s ease; cursor:pointer;}
.team-offer:hover{border-color:#5a606b; transform:translateY(-2px);}
/* uniform team logo badges: img fills badge, initials fallback only shows if the svg fails to load */
.logo, .logo2, .tl-logo{border-radius:50%; display:flex; align-items:center; justify-content:center; overflow:hidden; flex-shrink:0; font-family:'Titillium Web'; font-weight:900; color:#fff;}
.logo{width:52px; height:52px; margin:0 auto 12px; font-size:16px;}
.logo2{width:44px; height:44px; margin-bottom:14px; font-size:14px; background:rgba(255,255,255,0.12);}
.tl-logo{width:20px; height:20px; font-size:8px;}
.badge-img{width:68%; height:68%; object-fit:contain; display:block;}
.badge-fallback{display:none; align-items:center; justify-content:center; width:100%; height:100%;}
.team-offer .tname{font-weight:800; font-size:14.5px; margin-bottom:3px;}
.team-offer .tcat{font-size:11.5px; color:var(--muted2);}
/* v6.1: tag de rol (Reserva/Nº2/Nº1) como texto plano en negrita, sin fondo -- ver imagen de referencia */
.role-tag{display:block; font-size:13px; font-weight:800; margin-top:4px;}
/* v6.1: filas del recap de piloto reserva (test days / sustitución), estilo referencia: icono + dos
   líneas de texto coloreadas según resultado, sin fondo tipo chip. */
.reserve-recap{display:flex; flex-direction:column; gap:10px; margin-top:14px; text-align:left;}
.reserve-outcome{display:flex; align-items:flex-start; gap:10px;}
.reserve-outcome.up{color:var(--green);}
.reserve-outcome.down{color:#ff6a5c;}
.reserve-outcome .ro-icon{font-size:17px; line-height:1.35;}
.reserve-outcome .ro-line1{font-weight:800; font-size:14px;}
.reserve-outcome .ro-line2{font-weight:500; font-size:13px; opacity:0.85; margin-top:1px;}

/* timeline */
.timeline-panel{background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:6px 0;}
.tl-head{display:grid; grid-template-columns:40px 1fr 40px 42px 30px 30px 30px 52px; gap:6px; padding:12px 16px; font-size:10.5px; text-transform:uppercase; letter-spacing:0.06em; color:var(--muted2); font-weight:800; border-bottom:1px solid var(--line);}
.tl-row{display:grid; grid-template-columns:40px 1fr 40px 42px 30px 30px 30px 52px; gap:6px; padding:11px 16px; align-items:center; font-size:12.8px; border-bottom:1px solid rgba(255,255,255,0.03); transition:padding .2s ease, font-size .2s ease;}
.tl-row.now{background:linear-gradient(90deg, rgba(225,6,0,0.16), rgba(225,6,0,0.03));}
.tl-row.past{background:rgba(225,6,0,0.05);}
.tl-row.future{color:var(--muted2);}
.tl-age{font-family:'Space Mono'; font-weight:700;}
.tl-team{display:flex; align-items:center; gap:8px; font-weight:600; flex-wrap:wrap; row-gap:2px;}
.tl-team .dot{width:8px; height:8px; border-radius:50%; flex-shrink:0;}
.tl-team-name{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
/* v3.7.6: trofeo pegado al nombre del equipo, en la fila del año en que se ganó (mismo criterio visual
   que la vitrina, pero en miniatura para no romper el alto de la fila) */
.tl-title-icon{display:inline-flex; align-items:center; gap:2px; flex-shrink:0; line-height:1;}
.tl-title-icon .trophy-icon-img{height:16px; width:auto; max-width:15px; object-fit:contain; display:block; filter:drop-shadow(0 0 4px rgba(245,197,24,0.45));}
.tl-title-icon .trophy-icon-emoji{font-size:13px;}
.tl-title-count{font-size:9.5px; font-family:'Space Mono'; color:var(--muted); font-weight:700;}
.tl-ovr{font-family:'Titillium Web'; font-weight:900;}
/* v3.7.3: OVR de la trayectoria como píldora de color (igual criterio que .ovr-badge del player-card,
   mismos 4 tramos/colores -- ver tierClass()) en vez de número suelto, para que se lea de un vistazo. */
.tl-ovr-pill{display:inline-flex; align-items:center; justify-content:center; min-width:28px; padding:2px 7px; border-radius:6px; font-family:'Titillium Web'; font-weight:900; font-size:0.98em; line-height:1.4;}
.tl-ovr-pill.tier-s{background:linear-gradient(135deg,#F5C518,#ffe27a); color:#2b2200;}
.tl-ovr-pill.tier-a{background:var(--orange); color:#1a1200;}
.tl-ovr-pill.tier-b{background:#4a90d9; color:#04101c;}
.tl-ovr-pill.tier-c{background:#7a808a; color:#0a0a0c;}
.tl-pos{font-family:'Titillium Web'; font-weight:800; color:var(--gold); font-size:0.86em; letter-spacing:0.2px; white-space:nowrap; text-align:right;}
.tl-num{font-family:'Space Mono'; text-align:center;}
.tl-agg{background:var(--panel3); font-weight:800;}
/* density: con Detallada como único modo, la fila queda siempre compacta */
.timeline-panel.tl-detallada .tl-row{padding:5px 16px; font-size:11px;}
.timeline-panel.tl-detallada .tl-head{padding:9px 16px; font-size:9.5px;}

/* =====================================================
   RETIREMENT / SUMMARY
===================================================== */
.retire-overlay{background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:40px 24px; text-align:center;}
.retire-overlay h2{font-family:'Titillium Web'; font-weight:900; font-size:22px; margin-bottom:22px;}
.retire-overlay .btnrow{display:flex; gap:12px; justify-content:center;}

.summary-top{display:grid; grid-template-columns:1.1fr 0.9fr 0.7fr; gap:16px; margin-bottom:20px;}
@media(max-width:820px){.summary-top{grid-template-columns:1fr;}}
.summary-card{background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:22px;}
.summary-card .eb{font-size:11px; color:var(--muted2); text-transform:uppercase; letter-spacing:0.1em; font-weight:800; margin-bottom:8px;}
.summary-card .big{font-family:'Titillium Web'; font-weight:900; font-size:24px;}
.summary-card .statmini{display:flex; gap:22px; margin-top:14px;}
.summary-card .statmini div{text-align:left;}
.summary-card .statmini .v{font-weight:900; font-size:16px;}
.summary-card .statmini .k{font-size:10px; color:var(--muted2); text-transform:uppercase;}

.team-cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px;}
.team-card{border-radius:18px; padding:20px 16px; position:relative; overflow:hidden; border:1px solid var(--line);}
.team-card .tn{font-weight:800; font-size:14.5px; margin-bottom:10px;}
.team-card .st{display:flex; gap:16px; font-size:11.5px; color:rgba(255,255,255,0.75); margin-bottom:8px;}
.team-card .st b{display:block; font-size:15px; color:#fff;}
/* v5: trofeos apilados por categoría dentro de la tarjeta de escudería. Por defecto se superponen
   (margin-left negativo); al hacer hover del stack completo se separan y aparece la etiqueta con
   la cantidad + nombre del título. Si hay un solo trofeo, no hay nada para separar -- el hover
   solo revela el nombre. */
.trophy-stacks{display:flex; flex-wrap:wrap; gap:14px; margin-top:4px;}
.trophy-stack{position:relative; cursor:default;}
.trophy-stack-icons{display:flex; align-items:flex-end; height:30px;}
.trophy-stack-icon{
  height:28px; width:auto; max-width:26px; object-fit:contain; display:block;
  margin-left:calc(-13px * min(var(--i), 1)); /* la primera (i=0) no se corre, el resto se apila encima */
  filter:drop-shadow(0 2px 4px rgba(0,0,0,0.4));
  transition:transform .25s cubic-bezier(.2,.8,.3,1), margin-left .25s cubic-bezier(.2,.8,.3,1);
}
.trophy-stack:hover .trophy-stack-icon{
  margin-left:6px;
  transform:translateY(calc(var(--i) * -3px));
}
.trophy-stack:hover .trophy-stack-icon:first-child{margin-left:0;}
.trophy-stack-label{
  position:absolute; top:100%; left:0; margin-top:6px; white-space:nowrap;
  font-size:10.5px; font-weight:800; color:#fff; background:rgba(0,0,0,0.72); border:1px solid rgba(255,255,255,0.18);
  border-radius:999px; padding:3px 9px; opacity:0; transform:translateY(-4px); pointer-events:none;
  transition:opacity .2s ease, transform .2s ease; z-index:5;
}
.trophy-stack:hover .trophy-stack-label{opacity:1; transform:translateY(0);}

/* v5: apodo final según el resultado real de la carrera (reemplaza la vieja lectura de arquetipo) */
.legacy-tag{
  display:inline-block; margin:18px auto 0; padding:8px 22px; border-radius:999px; font-family:'Titillium Web';
  font-weight:900; font-size:13px; letter-spacing:0.12em; text-align:center;
}
.legacy-tag.legacy-villano{background:rgba(225,6,0,0.16); color:#ff6a5c; border:1px solid rgba(225,6,0,0.4);}
.legacy-tag.legacy-tipazo{background:rgba(51,209,122,0.14); color:var(--green); border:1px solid rgba(51,209,122,0.35);}
.legacy-tag.legacy-boludo{background:var(--panel3); color:var(--muted2); border:1px solid var(--line);}
.legacy-tag.legacy-lamentable{background:rgba(122,128,138,0.16); color:var(--muted); border:1px solid var(--line);}

.hidden{display:none !important;}
.fadein{animation:fadeIn .35s ease;}
@keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

.footer-note{text-align:center; color:var(--muted2); font-size:11.5px; margin-top:36px;}
</style>
</head>

/* =====================================================
   ROL DEL PILOTO EN F1: RESERVA / Nº2 / Nº1 (v6)
   - S.f1Role es la fuente de verdad para el jugador. Nunca lo elige el jugador directamente: lo decide
     el mercado (qué oferta acepta) o el propio equipo (recalculado cada temporada comparando OVR+rep
     contra el compañero, ver updatePlayerF1Role()).
   - TOP_TEAM_TIER separa a los 4 grandes (los únicos que piden "nivel de titular" antes de subirte al
     auto de carrera) del resto, que puede ofrecer un asiento titular directo si el piloto les suma.
===================================================== */
const TOP_TEAM_TIER = 85;
const ROLE_LABEL = {reserva:'Piloto Reserva', segundo:'Piloto Nº2', primero:'Piloto Nº1'};
const ROLE_SHORT  = {reserva:'RES', segundo:'P2', primero:'P1'};
// v6.1: retoque visual -- el rol se muestra como texto plano en negrita (sin fondo tipo chip), un
// color por rol, igual que el resto de las etiquetas de estado del juego (ej. "Fórmula 1" en gris).
const ROLE_COLOR  = {reserva:'var(--blue)', segundo:'var(--green)', primero:'var(--gold)'};

// Decide qué rol le ofrecería un equipo de F1 al jugador HOY, según su nivel actual (OVR+reputación)
// comparado contra el nivel del propio equipo (para los 4 grandes) o contra su mejor piloto IA (el resto).
// El arquetipo corre un poco el punto de mira, igual que ya hace con offerTierBias en buildF1OfferEvent.
function deriveOfferedRole(team){
 const arch = getArchetype();
 const readiness = S.ovr + (S.reputacion-50)*0.12 + arch.mods.offerTierBias*0.4;
 if(team.tier >= TOP_TEAM_TIER && readiness < team.tier - 9){
   return 'reserva';
 }
 const aiRoster = getTeamAIDrivers(team.name);
 if(!aiRoster.length) return 'primero';
 const bestAI = Math.max(...aiRoster.map(d=>d.ovr + d.reputacion*0.12));
 return readiness >= bestAI ? 'primero' : 'segundo';
}

// Crea el mundo de pilotos IA al arrancar/resetear una partida: mismo motor de atributos
// ocultos que usa el jugador (generateHiddenAttributes), aplicado individualmente a cada piloto.
function initAIDrivers(){
 const drivers = {};
 Object.keys(F1_DRIVERS_SEED).forEach(team=>{
   F1_DRIVERS_SEED[team].forEach(seed=>{
     // v3.5b: potencial máximo y edad de retiro ahora se sortean, cada uno dentro del rango puntual
     // que trae ese piloto en el seed (potRange/retireRange), en vez de una fórmula/valor único para todos.
     const potencialMaximo = seed.potRange ? clamp(randRange(seed.potRange[0], seed.potRange[1]), seed.ovr, 99)
                                            : Math.round(clamp(seed.ovr + (rnd()*14 - 3), seed.ovr, 99));
     const retireAge = seed.retireRange ? randRange(seed.retireRange[0], seed.retireRange[1])
                                         : (seed.retireAge || 41);
     drivers[seed.name] = {
       name:seed.name,
       team:team,
       age:seed.age,
       ovr:seed.ovr,
       potencialMaximo,
       velocidadCrecimiento:+(0.7 + rnd()*0.8).toFixed(2),
       edadPico:Math.round(25 + rnd()*8),
       reputacion:seed.rep!=null ? seed.rep : 50,
       status:'confirmado',
       nat:seed.nat || null,
       retireAge,
       retired:false,
       debuted:true, // ya está corriendo en F1 desde el arranque de la partida
       f1Titles:0 // v: títulos de Mundial de Pilotos ganados por este piloto IA durante esta partida (ver runSeasons / Historia)
     };
   });
 });
 // Se suma la cantera: arrancan libres (sin equipo), esperando a que se abra una vacante real.
 F1_RESERVE_POOL.forEach(seed=>{
   if(drivers[seed.name]) return; // por las dudas, nunca pisar un nombre que ya exista
   // v3.5b: potencial y retiro también sorteados dentro del rango puntual del seed (antes potencialMaximo
   // era fijo y la edad de retiro solo estaba fija para los regresos de ex-pilotos, sorteada 38-46 para el resto).
   const potencialMaximo = seed.potRange ? clamp(randRange(seed.potRange[0], seed.potRange[1]), seed.ovr, 99)
                                          : (seed.potencialMaximo || seed.ovr);
   const retireAge = seed.retireRange ? randRange(seed.retireRange[0], seed.retireRange[1])
                                       : (seed.retireAge || Math.round(38 + rnd()*8));
   drivers[seed.name] = {
     name:seed.name,
     team:null,
     age:seed.age,
     ovr:seed.ovr,
     potencialMaximo,
     velocidadCrecimiento:+(0.7 + rnd()*0.8).toFixed(2),
     edadPico:Math.round(25 + rnd()*8),
     reputacion:seed.rep!=null ? seed.rep : 50,
     status:'libre',
     nat:seed.nat || null,
     retireAge,
     retired:false,
     // ex-pilotos ya debutaron hace años; la cantera joven todavía no. Se distingue por si tiene retireRange
     // explícito en el seed (los ex-pilotos lo traen; la cantera joven también ahora, así que se marca aparte).
     debuted:!!seed.exPiloto,
     targetTeams:seed.targetTeams || [],
     f1Titles:0 // v: títulos de Mundial de Pilotos ganados por este piloto IA durante esta partida (ver runSeasons / Historia)
   };
 });
 return drivers;
}

 if(!S.aiDrivers || S.lateGamePoolInjected) return;

   S.aiDrivers[seed.name] = {
     name:seed.name,

     ovr:seed.ovr,

// Devuelve los dos pilotos IA de una escudería de F1.
function getTeamAIDrivers(teamName){
 if(!S.aiDrivers) return [];
 return Object.values(S.aiDrivers).filter(d=>d.team===teamName);
}

/* =====================================================
   INTEGRACIÓN DEL JUGADOR AL MERCADO (v3.1)
   - El jugador no tiene una lista propia: simplemente ocupa uno de los asientos reales de su
     escudería de F1 (ver pickTeam / releaseSeatForPlayer / f1SeatCapacity, ya existentes desde v3.0).
   - playerF1Team() dice si el jugador está en F1 ahora mismo y en qué escudería.
   - getTeamRosterWithPlayer() arma el plantel real (IA + jugador si corresponde) para mostrarlo en
     la pestaña Escuderías, tratando al jugador como un piloto más del mismo flujo.
===================================================== */
function playerF1Team(){
 if(S.retired || S.ladderIdx < LADDER.length) return null;
 return currentTeamName();
}
// Plantel completo de una escudería de F1 (pilotos IA + el jugador si está ahí), ordenado por OVR.
// El orden por OVR ya deja la estructura lista para distinguir "piloto 1 / piloto 2 / reserva" en el
// futuro (prioridad interna, paciencia del equipo, rival interno, ascenso desde reserva), pero hoy
// es puramente visual: no tiene ningún efecto de juego.
function getTeamRosterWithPlayer(teamName){
 const roster = getTeamAIDrivers(teamName).map(d=>({name:d.name, ovr:d.ovr, status:d.status, age:d.age, nat:d.nat, isPlayer:false, role:null}));
 if(playerF1Team()===teamName){
   const playerNat = (COUNTRIES.find(c=>c[1]===S.country)||[null])[0];
   roster.push({name:S.surname||'Vos', ovr:Math.round(S.ovr), status:'confirmado', age:Math.round(S.age), nat:playerNat, isPlayer:true, role:S.f1Role});
 }
 roster.sort((a,b)=>b.ovr-a.ovr);
 // v6: el rol ya no se intuye por el orden -- se etiqueta explícito. Los dos asientos de carrera (nunca
 // el de reserva) se reparten Nº1/Nº2; si el jugador ya trae un rol propio (S.f1Role), se respeta tal
 // cual y el compañero IA toma el complementario -- si no, se asigna por OVR+rep, igual que decide el equipo.
 const raceSeats = roster.filter(r=>r.role!=='reserva');
 const playerSeat = raceSeats.find(r=>r.isPlayer && r.role);
 raceSeats.forEach((r,i)=>{
   if(r.role) return;
   r.role = playerSeat ? (playerSeat.role==='primero' ? 'segundo' : 'primero') : (i===0 ? 'primero' : 'segundo');
 });
 return roster;
}
// Un paso de evolución de temporada para todos los pilotos IA. Reutiliza EXACTAMENTE el mismo motor
// que el jugador (calcOvrDeltaGeneric + calcRepDelta): la única diferencia es que, al no simular carrera
// por carrera para 22 pilotos, el "rendimiento real" de la temporada se aproxima comparando su ovr contra
// el tier de su auto (+ una pizca de suerte), en vez de contar victorias/podios como hace simulateOneSeason().
function evolveAIDrivers(){
 if(!S.aiDrivers) return;
 Object.values(S.aiDrivers).forEach(d=>{
   if(d.retired) return; // ya se bajó de la Fórmula 1 para siempre: no envejece, no evoluciona, no vuelve a aparecer
   d.age += 1;
   // Retiro real (v3.4): a diferencia de 'libre' (que es temporal y puede volver a fichar), esto es definitivo.
   if(d.retireAge && d.age >= d.retireAge){
     d.retired = true;
     d.team = null;
     d.status = 'retirado';
     return;
   }
   if(d.team) d.debuted = true;
   if(!d.team){
     if(!d.debuted){
       // Todavía no debutó en F1 (es de la cantera): se va acercando a su potencial mientras espera
       // asiento, en categorías inferiores. A propósito NO usa calcOvrDeltaGeneric -esa función tiene
       // una fase de declive atada a edadPico pensada para pilotos que YA corrieron un pico real- así
       // que acá solo hay una aproximación asintótica al potencialMaximo: nunca declina esperando.
       const margen = Math.max(d.potencialMaximo - d.ovr, 0);
       const growth = margen * 0.05 * d.velocidadCrecimiento;
       d.ovr = clamp(d.ovr + growth, 30, Math.min(99, d.potencialMaximo));
     }
     d.status = 'libre';
     return;
   }
   const teamTier = getF1TeamTier(d.team);
   const skillMargin = d.ovr - teamTier;
   const luck = (rnd()*2-1) * 0.25; // variación temporada a temporada, moderada a propósito
   const perfDelta = clamp(skillMargin/32 + luck, -1, 1);

   d.reputacion = clamp(d.reputacion + calcRepDelta(perfDelta), 0, 100);
   d.ovr = clamp(d.ovr + calcOvrDeltaGeneric(d, perfDelta), 30, Math.min(99, d.potencialMaximo));

   // Estado: identifica quién tiene más chances de perder su asiento.
   // Reputación floja o un piloto ya bien pasado de su pico son las dos señales de alarma.
   d.status = (d.reputacion < 42 || d.age > d.edadPico + 6) ? 'enduda' : 'confirmado';
 });
}

/* =====================================================
   MERCADO INTERNO DE PILOTOS DE F1 (v3.0 — primera etapa)
   - Cada piloto de F1 existe por sí mismo (S.aiDrivers) y simplemente ocupa un asiento (d.team).
   - Un piloto sin equipo (d.team === null) queda "libre": sigue existiendo dentro del estado del juego,
     pero no corre y no se muestra en ningún lado. Es un estado puramente interno, nunca visible
     para el jugador — no hay pantalla, pestaña ni lista de "pilotos libres".
   - Todavía NO incluye ofertas al jugador basadas en esto, ni contratos, ni negociaciones: eso llega después.
===================================================== */

// Cupo de asientos de IA que tiene una escudería de F1: normalmente 2, pero 1 si el jugador
// ocupa en este momento uno de esos dos asientos.
function f1SeatCapacity(teamName){
 const playerInF1 = S.ladderIdx >= LADDER.length && !S.retired;
 // v6: si el jugador es piloto RESERVA en este equipo, no ocupa ninguno de los dos asientos de carrera
 // (el equipo se queda con sus 2 titulares de siempre; el jugador es un tercero, extra, en el roster).
 if(playerInF1 && currentTeamName()===teamName && S.f1Role!=='reserva') return 1;
 return 2;
}

// Al fichar el jugador con una escudería de F1, alguien tiene que dejarle el asiento.
// Sale el más flojo (menor OVR) de los dos pilotos IA que tenía el equipo — el equipo se queda con
// su mejor piloto y el jugador entra en lugar del otro. Si el equipo ya tenía un asiento vacante
// (por ejemplo, todavía no se cubrió desde el mercado), no hace falta liberar a nadie.
function releaseSeatForPlayer(teamName){
 const roster = getTeamAIDrivers(teamName);
 if(roster.length < 2) return;
 const toRelease = [...roster].sort((a,b)=>a.ovr-b.ovr)[0];
 toRelease.team = null;
}

// Evaluación de fin de temporada: cada escudería de F1 revisa a sus dos pilotos IA (nunca al jugador,
// eso ya lo resuelve checkSeatRenewal por su cuenta). Un piloto en problemas ('enduda') puede perder
// el asiento, pero no es automático ni frecuente: la gran mayoría de las temporadas nadie se mueve.
function evaluateAISeatLosses(){
 if(!S.aiDrivers) return;
 Object.values(S.aiDrivers).forEach(d=>{
   if(!d.team) return; // ya está libre
   if(d.status==='enduda' && rnd() < 0.30){
     d.team = null;
   }
 });
}

// Cubre las vacantes de asientos de F1 con el mejor piloto libre disponible. A propósito simple:
// no hay negociaciones ni preferencias todavía — solo "el mejor libre entra al equipo que más lo necesita".
// Los equipos de mayor nivel cubren su vacante primero, así se quedan con el mejor piloto libre disponible.
function fillMarketVacancies(){
 if(!S.aiDrivers) return;
 let vacancies = [];
 F1_TEAMS.forEach(t=>{
   const cap = f1SeatCapacity(t.name);
   const have = getTeamAIDrivers(t.name).length;
   for(let i=0; i<cap-have; i++) vacancies.push(t.name);
 });
 if(!vacancies.length) return;
 vacancies.sort((a,b)=>getF1TeamTier(b)-getF1TeamTier(a));
 vacancies.forEach(teamName=>{
   const freeAgents = Object.values(S.aiDrivers).filter(d=>!d.team && !d.retired).sort((a,b)=>b.ovr-a.ovr);
   if(!freeAgents.length) return;
   // Preferencia blanda de cantera: entre los 3 mejores libres por OVR, si alguno tiene a este equipo
   // como target, se lo queda a él en vez de automáticamente al de más OVR. No es una garantía de
   // fichaje ahí -si ninguno de los 3 mejores apunta a este equipo, gana el de más OVR como siempre.
   const top = freeAgents.slice(0,3);
   const preferred = top.find(d=>d.targetTeams && d.targetTeams.includes(teamName));
   const pick = preferred || freeAgents[0];
   pick.team = teamName;
   pick.debuted = true;
 });
}

/* =====================================================
   ARQUETIPOS (v3.3)
   - Se sortea UNA sola vez, en generateHiddenAttributes(), al confirmar el piloto.
   - IMPORTANTE (decisión de diseño): el arquetipo NUNCA define el OVR ni el potencial máximo
     directamente. Eso ya lo hacen potencialMaximo/velocidadCrecimiento/edadPico (los "genes ocultos").
     Si el arquetipo fijara un rango de OVR, sería el mismo sistema de potencial oculto con otro nombre.
   - En cambio, el arquetipo SOLO inclina PROBABILIDADES: qué tan seguido te llegan ofertas grandes,
     qué tan seguido salen bien las apuestas de los eventos, qué tan resiliente sos ante malas
     temporadas, y qué tan arriesgado es tu paso por el mercado de asientos. Nunca garantiza nada:
     una Leyenda puede fracasar y un Fracaso puede terminar siendo campeón — solo que las probabilidades
     de cada historia son distintas.
   - mods:
       offerTierBias    → corre hacia arriba/abajo el nivel de equipo que el mercado de F1 te ofrece
       offerCountBonus  → ofertas extra (o de menos) sobre la cantidad base que da la reputación
       seatRiskMult     → multiplica el riesgo de perder el asiento (checkSeatRenewal)
       perfPosMult      → cuánto se amplifica una temporada por encima de lo esperado del auto
       perfNegMult      → cuánto se amplifica (o se amortigua) una temporada por debajo de lo esperado
       eventSuccessMult → multiplica la chance de éxito al arriesgarse en un evento
       transferChanceMult → multiplica la chance de que un equipo mejor te tiente estando en F1
===================================================== */

// Sorteo ponderado por S.archetype.chance (deben sumar 100, pero funciona igual si no suman exacto).
function pickArchetype(){
 const total = ARCHETYPES.reduce((s,a)=>s+a.chance, 0);
 let roll = rnd()*total;
 for(const a of ARCHETYPES){
   if(roll < a.chance) return a;
   roll -= a.chance;
 }
 return ARCHETYPES[ARCHETYPES.length-1];
}
// Devuelve el objeto de arquetipo del jugador (nunca null: si por algo no hay sorteado, cae en "Buen piloto",
// el arquetipo neutro, para que ningún multiplicador quede undefined).
function getArchetype(){
 return ARCHETYPES.find(a=>a.id===S.archetype) || ARCHETYPES.find(a=>a.id==='buenPiloto');
}

// arma los chips de la vitrina a partir de S.titles; cada categoría se muestra por separado, nunca sumadas

// asociado a ESE equipo/temporada de un vistazo, en vez de vivir solo aparte en la vitrina general.
function tlTitlesHTML(titleIds, age){
 if(!titleIds || !titleIds.length) return '';
 // agrupamos por si en un mismo bloque de temporadas se repite la misma categoría (varios años, mismo título)
 const counts = {};
 titleIds.forEach(id=>{ counts[id] = (counts[id]||0)+1; });
 return TROPHY_ORDER
   .filter(id=>counts[id])
   .map(id=>{
     const meta = TROPHY_META[id];
     const n = counts[id];
     const label = `${meta.label} · ${age} años${n>1?` (×${n})`:''}`;
     return `<span class="tl-title-icon" title="${label}">${trophyIconHTML(meta)}${n>1?`<span class="tl-title-count">×${n}</span>`:''}</span>`;
   }).join('');
}
function trophyRowHTML(titles){
 const chips = TROPHY_ORDER
   .filter(id => (titles[id]||0) > 0)
   .map(id => {
     const meta = TROPHY_META[id];
     return `<span class="trophy-chip" data-trophy-id="${id}" title="${meta.label}">${trophyIconHTML(meta)}<span class="c">×${titles[id]}</span></span>`;
   }).join('');
 return chips || '<span class="trophy-empty">Vitrina vacía</span>';
}

function fmtMoney(v, symbol){
 symbol = symbol || '$';
 if(v>=1000000) return symbol+(v/1000000).toFixed(v>=10000000?0:1)+'M';

 return symbol+v;
}

 </div>

}
